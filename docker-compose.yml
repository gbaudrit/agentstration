services:
  aep-key-provisioner:
    image: alpine:3.22
    command: >-
      sh -ec 'provision() { target="$$1/token"; if [ ! -f "$$target" ]; then temporary="$$target.tmp"; head -c 32 /dev/urandom | base64 | tr -d "\r\n" > "$$temporary"; chmod 600 "$$temporary"; mv "$$temporary" "$$target"; fi; test "$$(wc -c < "$$target")" -ge 32; }; provision /keys/ollama; provision /keys/llamacpp; provision /keys/localai; provision /keys/utilities'
    volumes:
      - aep-ollama-key:/keys/ollama
      - aep-llamacpp-key:/keys/llamacpp
      - aep-localai-key:/keys/localai
      - aep-utilities-key:/keys/utilities
    restart: "no"

  ollama-extension:
    build:
      context: .
      dockerfile: Dockerfile.extension
      args: { PROJECT: src/Agentstration.Extensions.Ollama/Agentstration.Extensions.Ollama.csproj, ENTRYPOINT_DLL: Agentstration.Extensions.Ollama.dll }
    environment: { Aep__EnrollmentMode: SharedKeyFile, Aep__SharedKeyFile__Path: /run/aep-key/token }
    volumes: [aep-ollama-key:/run/aep-key:ro]
    depends_on: { aep-key-provisioner: { condition: service_completed_successfully } }

  llama-cpp-extension:
    build:
      context: .
      dockerfile: Dockerfile.extension
      args: { PROJECT: src/Agentstration.Extensions.LlamaCpp/Agentstration.Extensions.LlamaCpp.csproj, ENTRYPOINT_DLL: Agentstration.Extensions.LlamaCpp.dll }
    environment: { Aep__EnrollmentMode: SharedKeyFile, Aep__SharedKeyFile__Path: /run/aep-key/token }
    volumes: [aep-llamacpp-key:/run/aep-key:ro]
    depends_on: { aep-key-provisioner: { condition: service_completed_successfully } }

  localai-extension:
    build:
      context: .
      dockerfile: Dockerfile.extension
      args: { PROJECT: src/Agentstration.Extensions.LocalAI/Agentstration.Extensions.LocalAI.csproj, ENTRYPOINT_DLL: Agentstration.Extensions.LocalAI.dll }
    environment: { Aep__EnrollmentMode: SharedKeyFile, Aep__SharedKeyFile__Path: /run/aep-key/token }
    volumes: [aep-localai-key:/run/aep-key:ro]
    depends_on: { aep-key-provisioner: { condition: service_completed_successfully } }

  utilities-extension:
    build:
      context: .
      dockerfile: Dockerfile.extension
      args: { PROJECT: src/Agentstration.Extensions.Utilities/Agentstration.Extensions.Utilities.csproj, ENTRYPOINT_DLL: Agentstration.Extensions.Utilities.dll }
    environment: { Aep__EnrollmentMode: SharedKeyFile, Aep__SharedKeyFile__Path: /run/aep-key/token }
    volumes: [aep-utilities-key:/run/aep-key:ro]
    depends_on: { aep-key-provisioner: { condition: service_completed_successfully } }

  agentstration:
    build: .
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AI__Provider: Deterministic
      Data__Directory: /data
      Agentstration__Aep__Transport__AllowedHttpHosts__0: ollama-extension
      Agentstration__Aep__Transport__AllowedHttpHosts__1: llama-cpp-extension
      Agentstration__Aep__Transport__AllowedHttpHosts__2: localai-extension
      Agentstration__Aep__Transport__AllowedHttpHosts__3: utilities-extension
      Agentstration__Aep__Transport__AllowedPrivateNetworkHosts__0: ollama-extension
      Agentstration__Aep__Transport__AllowedPrivateNetworkHosts__1: llama-cpp-extension
      Agentstration__Aep__Transport__AllowedPrivateNetworkHosts__2: localai-extension
      Agentstration__Aep__Transport__AllowedPrivateNetworkHosts__3: utilities-extension
      Agentstration__Extensions__Agentstration.Extensions.Ollama__Endpoint: http://ollama-extension:8080
      Agentstration__Extensions__Agentstration.Extensions.Ollama__AuthenticationMode: StaticBearer
      Agentstration__Extensions__Agentstration.Extensions.Ollama__EnrollmentMode: SharedKeyFile
      Agentstration__Extensions__Agentstration.Extensions.Ollama__SharedKeyFile__Path: /run/aep-keys/ollama/token
      Agentstration__Extensions__Agentstration.Extensions.LlamaCpp__Endpoint: http://llama-cpp-extension:8080
      Agentstration__Extensions__Agentstration.Extensions.LlamaCpp__AuthenticationMode: StaticBearer
      Agentstration__Extensions__Agentstration.Extensions.LlamaCpp__EnrollmentMode: SharedKeyFile
      Agentstration__Extensions__Agentstration.Extensions.LlamaCpp__SharedKeyFile__Path: /run/aep-keys/llamacpp/token
      Agentstration__Extensions__Agentstration.Extensions.LocalAI__Endpoint: http://localai-extension:8080
      Agentstration__Extensions__Agentstration.Extensions.LocalAI__AuthenticationMode: StaticBearer
      Agentstration__Extensions__Agentstration.Extensions.LocalAI__EnrollmentMode: SharedKeyFile
      Agentstration__Extensions__Agentstration.Extensions.LocalAI__SharedKeyFile__Path: /run/aep-keys/localai/token
      Agentstration__Extensions__Agentstration.Extensions.Utilities__Endpoint: http://utilities-extension:8080
      Agentstration__Extensions__Agentstration.Extensions.Utilities__AuthenticationMode: StaticBearer
      Agentstration__Extensions__Agentstration.Extensions.Utilities__EnrollmentMode: SharedKeyFile
      Agentstration__Extensions__Agentstration.Extensions.Utilities__SharedKeyFile__Path: /run/aep-keys/utilities/token
    volumes:
      - agentstration-data:/data
      - aep-ollama-key:/run/aep-keys/ollama:ro
      - aep-llamacpp-key:/run/aep-keys/llamacpp:ro
      - aep-localai-key:/run/aep-keys/localai:ro
      - aep-utilities-key:/run/aep-keys/utilities:ro
    depends_on:
      aep-key-provisioner: { condition: service_completed_successfully }
      ollama-extension: { condition: service_started }
      llama-cpp-extension: { condition: service_started }
      localai-extension: { condition: service_started }
      utilities-extension: { condition: service_started }

volumes:
  agentstration-data:
  aep-ollama-key:
  aep-llamacpp-key:
  aep-localai-key:
  aep-utilities-key:
