# Default SQLite preview: exact images and host-side credentials; optional PostgreSQL overlay.
x-ready: &ready
  test:
    - CMD
    - bash
    - -ec
    - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"
  interval: 2s
  timeout: 5s
  retries: 60
  start_period: 20s

services:
  server:
    image: ${PREVIEW_SERVER_IMAGE:?Prepare a digest-pinned preview first}
    restart: unless-stopped
    labels:
      io.agentstration.preview.environment: ${PREVIEW_ENVIRONMENT_ID:?}
      io.agentstration.preview.source: ${PREVIEW_SERVER_SHA:?}
    ports: ["127.0.0.1:${PREVIEW_PORT:?}:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Preview
      AllowedHosts: localhost;127.0.0.1;server
      AI__Provider: Deterministic
      Data__Directory: /data
      Agentstration__Storage__Provider: Sqlite
      Agentstration__ManagementApi__BaseAddress: http://localhost:8080/
      Agentstration__RuntimeApi__BaseAddress: http://localhost:8080/
      Agentstration__WorkApi__BaseAddress: http://localhost:8080/
      Agentstration__FlowApi__BaseAddress: http://localhost:8080/
    secrets:
      - source: server_configuration
        target: /app/appsettings.Preview.json
      - awp_key
    volumes: [data:/data]
    healthcheck: *ready

  worker:
    image: ${PREVIEW_WORKER_IMAGE:?Prepare a digest-pinned preview first}
    restart: unless-stopped
    labels:
      io.agentstration.preview.environment: ${PREVIEW_ENVIRONMENT_ID}
      io.agentstration.preview.source: ${PREVIEW_WORKER_SHA:?}
    environment:
      Agentstration__RuntimeWorker__AuthorityUrl: http://server:8080
      Agentstration__RuntimeWorker__InstanceId: ${PREVIEW_INSTANCE_ID:?}
      Agentstration__RuntimeWorker__WorkerId: ${PREVIEW_WORKER_ID:?}
      Agentstration__RuntimeWorker__CredentialId: ${PREVIEW_CREDENTIAL_ID:?}
      Agentstration__RuntimeWorker__SharedKeyFile: /run/secrets/awp_key
      Agentstration__RuntimeWorker__AllowInsecureHttp: "true"
    secrets: [awp_key]
    depends_on:
      server: {condition: service_healthy}
    healthcheck: *ready

volumes:
  data:
    labels:
      io.agentstration.preview.environment: ${PREVIEW_ENVIRONMENT_ID}

secrets:
  server_configuration:
    file: ${PREVIEW_STATE_DIRECTORY:?}/server-configuration.json
  awp_key:
    file: ${PREVIEW_STATE_DIRECTORY}/worker.key
