# Optional overlay. The helper selects this file only for a recorded PostgreSQL preview.
services:
  server:
    environment:
      Agentstration__Storage__Provider: PostgreSql
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: ${PREVIEW_POSTGRES_IMAGE:?Prepare a digest-pinned PostgreSQL preview first}
    platform: linux/amd64
    restart: unless-stopped
    labels:
      io.agentstration.preview.environment: ${PREVIEW_ENVIRONMENT_ID:?}
      io.agentstration.preview.owner: ${PREVIEW_OWNER_ID:-unmanaged}
    environment:
      POSTGRES_DB: agentstration
      POSTGRES_USER: agentstration
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  postgres-data:
    labels:
      io.agentstration.preview.environment: ${PREVIEW_ENVIRONMENT_ID}
      io.agentstration.preview.owner: ${PREVIEW_OWNER_ID:-unmanaged}

secrets:
  postgres_password:
    file: ${PREVIEW_STATE_DIRECTORY:?}/postgres.password
