apiVersion: agentstration.io/v1
kind: ConnectedServiceType
metadata:
  name: github
  namespace: agentstration.connected-services
  tags:
    category: development
    vendor: github
    product: github
definition:
  displayName: "GitHub"
  description: "One GitHub API host and the permissions of a fine-grained personal access token. Connection metadata only; execution requires an authorized compatible consumer."
  enabled: true
  preferredVersion: 1.0.0
  usePolicy:
    grants: []
  versions:
    - version: 1.0.0
      schemaDigest: sha256:51da7ceec6376f5f1caac4b422cfa832718adde8bb2de8fda7940d2aff2b043f
      schema:
        type: object
        additionalProperties: false
      inputs:
        - id: baseUrl
          required: true
          type: string
          protection: standard
          format: uri
          description: "GitHub API base URL, for example https://api.github.com or an Enterprise Server API origin."
        - id: token
          required: true
          type: string
          protection: secured
          description: "Fine-grained personal access token restricted to the required repositories and permissions."
      exports:
        - id: baseUrl
          type: string
          protection: standard
          format: uri
          sourceInputId: baseUrl
        - id: token
          type: string
          protection: secured
          sourceInputId: token
