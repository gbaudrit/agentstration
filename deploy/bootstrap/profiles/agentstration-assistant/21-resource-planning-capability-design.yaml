apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-capability-design, namespace: agentstration.resource-planning }
definition:
  displayName: Resource Planning - capability design
  description: Durable functional capability design child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-capability-designer } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Intent evidence }
      - { type: agent, name: design, displayName: Design capabilities, agent: { resourceId: resource-planning-capability-designer }, inputMapping: "${input}" }
      - { type: output, name: output, displayName: Capability intents, outputMapping: "${steps.design.output}" }
    transitions:
      - { id: input-to-design, fromStep: input, event: completed, toStep: design }
      - { id: design-to-output, fromStep: design, event: completed, toStep: output }
  publish: true
  activate: true
