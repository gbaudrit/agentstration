apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-solution-consolidation, namespace: agentstration.resource-planning }
definition:
  displayName: Resource Planning - solution consolidation
  description: Durable contradiction detection and functional consolidation child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-solution-consolidator } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Specialist contributions }
      - { type: agent, name: consolidate, displayName: Consolidate plan, agent: { resourceId: resource-planning-solution-consolidator }, inputMapping: "${input}" }
      - { type: output, name: output, displayName: Coherent functional plan, outputMapping: "${steps.consolidate.output}" }
    transitions:
      - { id: input-to-consolidate, fromStep: input, event: completed, toStep: consolidate }
      - { id: consolidate-to-output, fromStep: consolidate, event: completed, toStep: output }
  publish: true
  activate: true
