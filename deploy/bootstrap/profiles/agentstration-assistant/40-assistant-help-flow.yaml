apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: assistant-help
  namespace: agentstration.assistant
definition:
  displayName: Agentstration Help and Documentation
  description: Produces evidence-backed product help from the bundled documentation boundary.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: assistant-help } }
  graph:
    entryStep: input
    inputSchema:
      type: object
      properties:
        prompt: { type: string, minLength: 1, maxLength: 16000 }
      required: [prompt]
      additionalProperties: false
    steps:
      - { type: input, name: input, displayName: Help request }
      - type: agent
        name: answer
        displayName: Search documentation and answer
        agent: { resourceId: assistant-help }
      - { type: output, name: output, displayName: Documented answer }
    transitions:
      - { id: input-to-answer, fromStep: input, event: completed, toStep: answer }
      - { id: answer-to-output, fromStep: answer, event: completed, toStep: output }
    outputSchema:
      type: object
      additionalProperties: true
  publish: true
  activate: true
