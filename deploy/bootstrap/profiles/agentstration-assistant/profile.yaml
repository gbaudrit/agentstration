apiVersion: agentstration.io/v1
kind: BootstrapProfile
metadata:
  name: agentstration-assistant
definition:
  displayName: Install Agentstration Assistant
  description: Installs the official Resource Planning and Assistant Packs into the dedicated Assistant Workspace.
  targetScope: workspace
  bindings:
    - name: assistant-model
      targetKind: modelProfile
      displayName: Assistant and planning model
      description: Model profile shared by the official Assistant and Resource Planning Agents.
      required: true
    - name: assistant-runtime
      targetKind: runtimeProfile
      displayName: Assistant and planning runtime
      description: Local runtime profile shared by the official Assistant and Resource Planning Agents.
      required: true
