apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-integration-design, namespace: agentstration.resource-planning }
definition:
  displayName: Resource Planning - integration design
  description: Durable functional integration design child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-integration-designer, namespace: agentstration.resource-planning } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Solution evidence }
      - { type: agent, name: design, displayName: Design integrations, agent: { resourceId: resource-planning-integration-designer, namespace: agentstration.resource-planning }, inputMapping: "${input}" }
      - { type: output, name: completed, displayName: Integration intents, outcome: success, outputMapping: "${steps.design.output}" }
      - { type: output, name: error, displayName: Integration design failed, outcome: error, code: RESOURCE_PLANNING_AGENT_FAILED, message: The integration design Agent failed., outputMapping: "${transition.output}" }
    transitions:
      - { id: input-to-design, fromStep: input, event: completed, toStep: design }
      - { id: design-completed, fromStep: design, event: success, toStep: completed }
      - { id: design-error, fromStep: design, event: error, toStep: error }
  publish: true
  activate: true
