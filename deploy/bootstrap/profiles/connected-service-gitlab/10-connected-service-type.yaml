apiVersion: agentstration.io/v1
kind: ConnectedServiceType
metadata:
  name: gitlab
  namespace: agentstration.connected-services
  tags:
    category: development
    vendor: gitlab
    product: gitlab
definition:
  displayName: "GitLab"
  description: "One GitLab instance and an access-token principal. Connection metadata only; execution requires an authorized compatible consumer."
  enabled: true
  preferredVersion: 1.0.0
  usePolicy:
    grants: []
  versions:
    - version: 1.0.0
      schemaDigest: sha256:51da7ceec6376f5f1caac4b422cfa832718adde8bb2de8fda7940d2aff2b043f
      schema:
        type: object
        additionalProperties: false
      inputs:
        - id: baseUrl
          required: true
          type: string
          protection: standard
          format: uri
          description: "GitLab API base URL, including its API version path."
        - id: token
          required: true
          type: string
          protection: secured
          description: "GitLab access token with explicitly granted scopes."
      exports:
        - id: baseUrl
          type: string
          protection: standard
          format: uri
          sourceInputId: baseUrl
        - id: token
          type: string
          protection: secured
          sourceInputId: token
