apiVersion: agentstration.io/v1
kind: Secret
metadata:
  name: preview-document-password
  namespace: default
definition:
  valueFrom:
    configuration: Agentstration:Bootstrap:Secrets:PostgreSqlDocumentsPassword
  vault:
    name: preview-documents-vault
    scopeRef: /instance
  key: postgresql-documents-password
  displayName: Preview document database password
