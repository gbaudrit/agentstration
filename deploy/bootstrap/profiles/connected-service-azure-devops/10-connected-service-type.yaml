          type: string
          protection: standard
          format: uri
          description: "Exact Azure DevOps organization URL."
        - id: personalAccessToken
          required: true
          type: string
          protection: secured
          description: "Personal access token for this organization; the consumer implements the required HTTP authentication."
      exports:
        - id: organizationUrl
          type: string
          protection: standard
          format: uri
          sourceInputId: organizationUrl
        - id: personalAccessToken
          type: string
