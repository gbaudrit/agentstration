apiVersion: agentstration.io/v1
kind: BootstrapProfile
metadata:
  name: rss-functions
definition:
  displayName: rss-functions
  description: Explicitly expose the previously published RSS mapping. Apply rss-schemas first in the same scope.
  # Installation owner: instance, tenant or workspace.
  # Use the same targetScope in rss-schemas and rss-functions.
  targetScope: instance
