apiVersion: agentstration.io/v1
kind: ToolSet
metadata:
  name: agentstration-documentation-acquisition
  tags:
    agentstration.io/category: knowledge-source
definition:
  displayName: Agentstration documentation acquisition
  description: Exact Crawl4AI Tools selected for the documentation ingestion Flow.
  version: 1.0.0
  publish: true
  members:
    - tool: { binding: crawl4ai-crawl }
      capability: web.crawl
      route: default
    - tool: { binding: crawl4ai-read }
      capability: content.read
      route: default
    - tool: { binding: crawl4ai-delete }
      capability: content.delete
      route: default
