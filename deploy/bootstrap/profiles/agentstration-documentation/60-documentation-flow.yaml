apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: agentstration-documentation-assistant
definition:
  displayName: Ask Agentstration documentation
  description: Runs the governed documentation assistant.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: agentstration-documentation-assistant } }
  graph:
    entryStep: input
    inputSchema:
      type: object
      properties:
        prompt: { type: string, minLength: 1, maxLength: 16000 }
      required: [prompt]
      additionalProperties: false
    steps:
      - { type: input, name: input, displayName: Documentation question }
      - type: agent
        name: answer
        displayName: Answer from governed documentation
        agent: { resourceId: agentstration-documentation-assistant }
      - { type: output, name: output, displayName: Documented answer }
    transitions:
      - { id: input-answer, fromStep: input, event: completed, toStep: answer }
      - { id: answer-output, fromStep: answer, event: completed, toStep: output }
    outputSchema: { type: object, additionalProperties: true }
  publish: true
  activate: true
