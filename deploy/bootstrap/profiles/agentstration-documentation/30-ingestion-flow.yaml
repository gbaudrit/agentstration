apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: agentstration-documentation-ingestion
definition:
  displayName: Acquire Agentstration documentation
  description: Crawls the public documentation site, normalizes its pages into a bounded corpus, and persists it through the standard Storage Flow.
  version: 1.0.0
  enabled: true
  metadata:
    knowledge.contract: knowledge.ingestion/v1
  spec: { flowKind: direct, target: { kind: agent, id: unused-graph-target } }
  graph:
    entryStep: input
    inputSchema:
      type: object
      properties:
        knowledgeSourceId: { type: string }
        knowledgeSourceUid: { type: string }
        knowledgeSourceGeneration: { type: integer }
        sourceConfiguration: { type: object }
        parameters: { type: object }
        caller: { type: object }
        correlationId: { type: string }
        acquisitionId: { type: string }
      required: [knowledgeSourceId, knowledgeSourceUid, knowledgeSourceGeneration, sourceConfiguration, parameters, caller, correlationId, acquisitionId]
      additionalProperties: false
    steps:
      - { type: input, name: input, displayName: Acquisition request }
      - type: toolRoute
        name: crawl
        displayName: Crawl documentation site
        toolSet: { resourceId: agentstration-documentation-acquisition, version: 1.0.0 }
        capability: web.crawl
        route: default
        argumentsMapping:
          startUrl: "${input.sourceConfiguration.url}"
          maximumDepth: "${input.sourceConfiguration.maximumDepth}"
          maximumPages: "${input.sourceConfiguration.maximumPages}"
          correlationId: "${input.correlationId}"
      - type: toolRoute
        name: create
        displayName: Create staged documentation
        toolSet: { resourceId: staged-artifacts-builtin, version: 1.0.0 }
        capability: staged-artifact.create
        route: default
        argumentsMapping: { fileName: agentstration-documentation.md, mediaType: "${steps.crawl.output.structuredContent.corpus.mediaType}" }
      - type: repeat
        name: transfer
        displayName: Transfer bounded content chunks
        flow: { resourceId: agentstration-documentation-transfer-chunk, versionStrategy: exact, version: 1.0.0 }
        inputMapping: { contentReference: "${steps.crawl.output.structuredContent.corpus.reference}", stagedArtifactId: "${steps.create.output.artifactReference}", offset: 0 }
        nextInputMapping: { contentReference: "${steps.transfer.output.contentReference}", stagedArtifactId: "${steps.transfer.output.stagedArtifactId}", offset: "${steps.transfer.output.nextOffset}" }
        until: "${steps.transfer.output.endOfContent == true}"
        maximumIterations: 1000
      - type: toolRoute
        name: seal
        displayName: Seal staged documentation
        toolSet: { resourceId: staged-artifacts-builtin, version: 1.0.0 }
        capability: staged-artifact.seal
        route: default
        argumentsMapping: { artifactId: "${steps.create.output.artifactReference}" }
      - type: flow
        name: persist
        displayName: Persist documentation
        flow: { resourceId: artifact-storage-filesystem-write-builtin, versionStrategy: active }
        inputMapping: { stagedArtifactId: "${steps.create.output.artifactReference}", producerFlowRunId: "${execution.flowRunId}", producerFlowStepId: seal }
      - type: toolRoute
        name: cleanup
        displayName: Delete temporary Crawl4AI content
        toolSet: { resourceId: agentstration-documentation-acquisition, version: 1.0.0 }
        capability: content.delete
        route: default
        argumentsMapping: { contentReference: "${steps.crawl.output.structuredContent.corpus.reference}" }
      - type: output
        name: output
        displayName: Publishable documentation Artifact
        outputMapping:
          artifacts:
            - artifactId: "${steps.persist.output.flowRunArtifactId}"
              kind: durable
              disposition: publishable
              name: Agentstration documentation
              mediaType: "${steps.seal.output.MediaType}"
              digest: "${steps.seal.output.Sha256}"
    transitions:
      - { id: input-crawl, fromStep: input, event: completed, toStep: crawl }
      - { id: crawl-create, fromStep: crawl, event: completed, toStep: create }
      - { id: create-transfer, fromStep: create, event: completed, toStep: transfer }
      - { id: transfer-seal, fromStep: transfer, event: completed, toStep: seal }
      - { id: seal-persist, fromStep: seal, event: completed, toStep: persist }
      - { id: persist-cleanup, fromStep: persist, event: completed, toStep: cleanup }
      - { id: cleanup-output, fromStep: cleanup, event: completed, toStep: output }
    outputSchema:
      type: object
      properties:
        artifacts: { type: array, items: { type: object } }
      required: [artifacts]
      additionalProperties: false
  publish: true
  activate: true
