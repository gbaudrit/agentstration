apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: agentstration-documentation-assistant
definition:
  displayName: Agentstration documentation assistant
  description: Answers Agentstration questions from the governed documentation snapshot.
  handler: prompt-agent
  instructions: |
    Answer Agentstration product and configuration questions only from evidence returned by the assigned Knowledge Source Tools. Cite the returned artifact and source references. If no evidence is available, say so explicitly. Never invent resource fields, routes, configuration keys, support status, or operational state.
  modelProfile: { binding: assistant-model }
  runtimeProfile: { binding: assistant-runtime }
  tools: []
  toolSets:
    - toolSet: { name: agentstration-documentation }
      version: 1.0.0
      members: []
  behaviors: [product-help, evidence-required, local-first]
  middleware: []
  contextProviders: []
  settings: {}
