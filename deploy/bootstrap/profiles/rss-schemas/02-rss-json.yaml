{
  "apiVersion": "agentstration.io/v1",
  "kind": "Schema",
  "metadata": {
    "name": "rss-json"
  },
  "definition": {
    "displayName": "rss-json",
    "format": "json-schema",
    "dialect": "https://json-schema.org/draft/2020-12/schema",
    "content": {
      "type": "object",
      "properties": {
        "title": {
          "type": "string"
        },
        "link": {
          "type": "string"
        },
        "description": {
          "type": "string"
        },
        "version": {
          "type": "string"
        },
        "items": {
          "type": "array",
          "maxItems": 100,
          "items": {
            "type": "object",
            "properties": {
              "guid": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "publishedAt": {
                "type": "string",
                "format": "date-time"
              },
              "sourceUrl": {
                "type": "string"
              },
              "rating": {
                "type": "integer"
              }
            },
            "required": [
              "guid",
              "title"
            ],
            "additionalProperties": false
          }
        }
      },
      "required": [
        "title",
        "link",
        "version",
        "items"
      ],
      "additionalProperties": false
    },
    "publishVersion": "1.0.0"
  }
}
