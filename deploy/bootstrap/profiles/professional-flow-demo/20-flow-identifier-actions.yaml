apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: identifier-actions
  namespace: demo.flows-professionnels
definition:
  displayName: Identifier les actions
  description: Repère les actions explicites et implicites dans un contenu contextualisé.
  version: 1.0.0
  enabled: true
  spec:
    flowKind: direct
    target: { kind: agent, id: analyste-actions, namespace: demo.flows-professionnels }
  graph:
    entryStep: entree
    inputSchema:
      type: object
      properties:
        contexte: { type: string }
        contenu: { type: string }
        analyse: { type: string }
      required: [contexte, contenu, analyse]
      additionalProperties: false
    steps:
      - { type: input, name: entree, displayName: Contenu contextualisé }
      - type: agent
        name: identifier
        displayName: Identifier les actions
        agent: { resourceId: analyste-actions, namespace: demo.flows-professionnels }
        inputMapping:
          operation: Identifier
          contexte: "${input.contexte}"
          contenu: "${input.contenu}"
          analyse: "${input.analyse}"
      - type: output
        name: resultat
        displayName: Actions identifiées
        outputMapping:
          identification: "${steps.identifier.output}"
    transitions:
      - { id: entree-vers-identification, fromStep: entree, event: completed, toStep: identifier }
      - { id: identification-vers-resultat, fromStep: identifier, event: completed, toStep: resultat }
    outputSchema:
      type: object
      properties:
        identification: { type: string }
      required: [identification]
      additionalProperties: false
  metadata: { bootstrapProfile: professional-flow-demo, capability: actions-identification }
  publish: true
  activate: true
