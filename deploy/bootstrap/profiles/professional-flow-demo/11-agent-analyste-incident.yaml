apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: analyste-incident
  namespace: demo.flows-professionnels
  tags: { bootstrapProfile: professional-flow-demo, role: analyse-incident }
definition:
  displayName: Analyste d'incident
  description: Qualifie et analyse un incident à partir de faits techniques et métier.
  handler: prompt-agent
  instructions: |
    Tu analyses des incidents de production décrits en français.
    Distingue les faits, les symptômes, l'impact, la priorité, les hypothèses et la résolution proposée.
    Ne transforme jamais une hypothèse en cause confirmée. Cite les indices disponibles et les informations manquantes.
    Réponds en français avec des sections courtes et stables : Qualification, Impact, Symptômes, Diagnostic et Résolution proposée.
  modelProfile: { binding: demo-model }
  runtimeProfile: { binding: demo-runtime }
  tools: []
  behaviors: [diagnostic, faits-seulement]
  middleware: []
  contextProviders: []
  settings: {}
