apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: traiter-incident
  namespace: demo.flows-professionnels
definition:
  displayName: Traiter un incident
  description: Qualifie un incident et compose les mêmes capacités communes de compte-rendu, actions, tâches et communication.
  version: 1.0.0
  enabled: true
  spec:
    flowKind: direct
    target: { kind: agent, id: analyste-incident, namespace: demo.flows-professionnels }
  graph:
    entryStep: entree
    inputSchema:
      type: object
      properties:
        incident: { type: string, minLength: 1, maxLength: 16000 }
      required: [incident]
      additionalProperties: false
    steps:
      - { type: input, name: entree, displayName: Description de l'incident }
      - type: agent
        name: qualifierIncident
        displayName: Qualifier l'incident
        agent: { resourceId: analyste-incident, namespace: demo.flows-professionnels }
        inputMapping:
          operation: Qualification
          incident: "${input.incident}"
      - type: agent
        name: analyserIncident
        displayName: Analyser l'incident
        agent: { resourceId: analyste-incident, namespace: demo.flows-professionnels }
        inputMapping:
          operation: Analyse approfondie
          incident: "${input.incident}"
          qualification: "${steps.qualifierIncident.output}"
      - type: flow
        name: extraireActions
        displayName: Extraire les actions
        flow: { resourceId: extraire-actions, namespace: demo.flows-professionnels, versionStrategy: active }
        inputMapping:
          contexte: Incident de production
          contenu: "${input.incident}"
          analyse: "${steps.analyserIncident.output}"
      - type: flow
        name: creerTaches
        displayName: Créer les tâches
        flow: { resourceId: creer-taches, namespace: demo.flows-professionnels, versionStrategy: active }
        inputMapping:
          contexte: Incident de production
          actions: "${steps.extraireActions.output.actions}"
      - type: flow
        name: genererCompteRendu
        displayName: Générer un compte-rendu
        flow: { resourceId: generer-compte-rendu, namespace: demo.flows-professionnels, versionStrategy: active }
        inputMapping:
          typeContexte: Incident
          contenuSource: "${input.incident}"
          analyse: "${steps.analyserIncident.output}"
          actions: "${steps.extraireActions.output.actions}"
          taches: "${steps.creerTaches.output.taches}"
      - type: flow
        name: preparerCommunication
        displayName: Préparer une communication
        flow: { resourceId: preparer-communication, namespace: demo.flows-professionnels, versionStrategy: active }
        inputMapping:
          contexte: Incident de production
          publicCible: Utilisateurs du service de création de commandes
          objectif: Informer de l'incident, de son impact, de son état et des prochaines étapes.
          informationsImportantes:
            qualification: "${steps.qualifierIncident.output}"
            compteRendu: "${steps.genererCompteRendu.output.compteRendu}"
            actions: "${steps.extraireActions.output.actions}"
            taches: "${steps.creerTaches.output.taches}"
      - type: agent
        name: synthese
        displayName: Produire le bilan final
        agent: { resourceId: redacteur-professionnel, namespace: demo.flows-professionnels }
        inputMapping:
          operation: Synthèse finale
          typeContexte: Incident
          titre: Incident — Service de création de commandes
          qualification: "${steps.qualifierIncident.output}"
          analyse: "${steps.analyserIncident.output}"
          compteRendu: "${steps.genererCompteRendu.output.compteRendu}"
          actions: "${steps.extraireActions.output.actions}"
          taches: "${steps.creerTaches.output.taches}"
          communication: "${steps.preparerCommunication.output.communication}"
      - type: output
        name: resultat
        displayName: Incident traité
        outputMapping:
          finalOutput: "${steps.synthese.output}"
          compteRendu: "${steps.genererCompteRendu.output.compteRendu}"
          actions: "${steps.extraireActions.output.actions}"
          taches: "${steps.creerTaches.output.taches}"
          communication: "${steps.preparerCommunication.output.communication}"
    transitions:
      - { id: entree-vers-qualification, fromStep: entree, event: completed, toStep: qualifierIncident }
      - { id: qualification-vers-analyse, fromStep: qualifierIncident, event: completed, toStep: analyserIncident }
      - { id: analyse-vers-actions, fromStep: analyserIncident, event: completed, toStep: extraireActions }
      - { id: actions-vers-taches, fromStep: extraireActions, event: completed, toStep: creerTaches }
      - { id: taches-vers-compte-rendu, fromStep: creerTaches, event: completed, toStep: genererCompteRendu }
      - { id: compte-rendu-vers-communication, fromStep: genererCompteRendu, event: completed, toStep: preparerCommunication }
      - { id: communication-vers-synthese, fromStep: preparerCommunication, event: completed, toStep: synthese }
      - { id: synthese-vers-resultat, fromStep: synthese, event: completed, toStep: resultat }
    outputSchema:
      type: object
      properties:
        finalOutput: { type: string }
        compteRendu: { type: string }
        actions: { type: string }
        taches: { type: string }
        communication: { type: string }
      required: [finalOutput, compteRendu, actions, taches, communication]
      additionalProperties: false
  metadata: { bootstrapProfile: professional-flow-demo, process: incident }
  publish: true
  activate: true
