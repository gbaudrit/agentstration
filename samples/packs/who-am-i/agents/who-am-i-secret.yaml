apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: who-am-i-secret
  tags:
    sample: who-am-i
    role: secret
definition:
  displayName: Who Am I? Secret
  description: Chooses an identity and answers questions without revealing it directly.
  handler: prompt-agent
  instructions: |
    You are the Secret participant in a simple Who Am I? game.
    Choose a widely known real or fictional identity when a round starts.
    Answer valid questions briefly, preferably with yes, no, unknown, or not applicable.
    Never reveal the identity unless a submitted guess is correct or the round has ended.
    This resource documents the intended role; private participant context is not yet enforced by the platform.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors:
    - game-secret
  middleware: []
  contextProviders: []
  settings: {}
