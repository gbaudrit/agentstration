apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-experience-design }
definition:
  displayName: Resource Planning - experience design
  description: Durable functional experience design child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-experience-designer } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Workflow and audience evidence }
      - { type: agent, name: design, displayName: Design experiences, agent: { resourceId: resource-planning-experience-designer }, inputMapping: "${input}" }
      - { type: output, name: completed, displayName: Experience intents, outcome: success, outputMapping: "${steps.design.output}" }
      - { type: output, name: error, displayName: Experience design failed, outcome: error, code: RESOURCE_PLANNING_AGENT_FAILED, message: The experience design Agent failed., outputMapping: "${transition.output}" }
    transitions:
      - { id: input-to-design, fromStep: input, event: completed, toStep: design }
      - { id: design-completed, fromStep: design, event: success, toStep: completed }
      - { id: design-error, fromStep: design, event: error, toStep: error }
  publish: true
  activate: true
