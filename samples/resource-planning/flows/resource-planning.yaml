apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning }
definition:
  displayName: Functional Resource Planning
  description: Composes durable specialist Flows, then creates and validates a reviewable Resource Plan without applying it.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-solution-consolidator } }
  graph:
    entryStep: input
    inputSchema:
      type: object
      properties:
        goal: { type: string }
        context: { type: string }
      required: [goal]
      additionalProperties: false
    steps:
      - { type: input, name: input, displayName: Natural-language goal }
      - type: flow
        name: analyze-intent
        displayName: Analyze requirements
        flow: { resourceId: resource-planning-intent-analysis, versionStrategy: active }
        inputMapping: { goal: "${input.goal}", context: "${input.context}" }
      - type: flow
        name: design-capabilities
        displayName: Design roles and capabilities
        flow: { resourceId: resource-planning-capability-design, versionStrategy: active }
        inputMapping: { goal: "${input.goal}", intent: "${steps.analyze-intent.output}" }
      - type: flow
        name: design-workflows
        displayName: Design workflows
        flow: { resourceId: resource-planning-workflow-design, versionStrategy: active }
        inputMapping: { goal: "${input.goal}", intent: "${steps.analyze-intent.output}", capabilities: "${steps.design-capabilities.output}" }
      - type: flow
        name: design-integrations
        displayName: Design integrations
        flow: { resourceId: resource-planning-integration-design, versionStrategy: active }
        inputMapping: { goal: "${input.goal}", intent: "${steps.analyze-intent.output}", capabilities: "${steps.design-capabilities.output}" }
      - type: flow
        name: design-experiences
        displayName: Design experiences
        flow: { resourceId: resource-planning-experience-design, versionStrategy: active }
        inputMapping: { goal: "${input.goal}", workflows: "${steps.design-workflows.output}", audiences: "${steps.analyze-intent.output}" }
      - type: flow
        name: consolidate
        displayName: Consolidate and review
        flow: { resourceId: resource-planning-solution-consolidation, versionStrategy: active }
        inputMapping:
          goal: "${input.goal}"
          intent: "${steps.analyze-intent.output}"
          capabilities: "${steps.design-capabilities.output}"
          workflows: "${steps.design-workflows.output}"
          integrations: "${steps.design-integrations.output}"
          experiences: "${steps.design-experiences.output}"
      - type: condition
        name: ready
        displayName: Review planning readiness
        mode: Simple
        left: "${steps.consolidate.output.readiness}"
        operator: equals
        right: ready
      - type: output
        name: clarification
        displayName: Clarification required
        outcome: success
        outputMapping: { status: blocked, diagnostics: "${steps.consolidate.output.diagnostics}", draft: "${steps.consolidate.output.plan}" }
        schema: { type: object, additionalProperties: true }
      - type: tool
        name: create-plan
        displayName: Create governed Resource Plan
        tool: { resourceId: agentstration.resource-planning.plan.create }
        argumentsMapping:
          title: "${steps.consolidate.output.title}"
          goal: "${steps.consolidate.output.goal}"
          description: "${steps.consolidate.output.description}"
          plan: "${steps.consolidate.output.plan}"
      - type: tool
        name: submit-plan
        displayName: Submit reviewed plan
        tool: { resourceId: agentstration.resource-planning.plan.submit }
        argumentsMapping: { planId: "${steps.create-plan.output.plan.id.value}", expectedETag: "${steps.create-plan.output.etag}" }
      - type: tool
        name: materialize-plan
        displayName: Identify the profile and Tool choices required for review
        tool: { resourceId: agentstration.resource-planning.plan.materialize }
        argumentsMapping: { planId: "${steps.create-plan.output.plan.id.value}" }
      - type: output
        name: completed
        displayName: Plan ready for binding selection and review
        outcome: success
        outputMapping:
          status: ready-for-review
          plan: "${steps.submit-plan.output.plan}"
          materialization: "${steps.materialize-plan.output}"
        schema: { type: object, additionalProperties: true }
      - type: output
        name: error
        displayName: Resource planning failed
        outcome: error
        code: RESOURCE_PLANNING_FAILED
        message: Resource planning could not be completed.
        outputMapping: "${transition.output}"
        schema: { type: object, additionalProperties: true }
    transitions:
      - { id: input-to-intent, fromStep: input, event: completed, toStep: analyze-intent }
      - { id: intent-to-capabilities, fromStep: analyze-intent, event: completed, toStep: design-capabilities }
      - { id: intent-error, fromStep: analyze-intent, event: error, toStep: error }
      - { id: capabilities-to-workflows, fromStep: design-capabilities, event: completed, toStep: design-workflows }
      - { id: capabilities-error, fromStep: design-capabilities, event: error, toStep: error }
      - { id: workflows-to-integrations, fromStep: design-workflows, event: completed, toStep: design-integrations }
      - { id: workflows-error, fromStep: design-workflows, event: error, toStep: error }
      - { id: integrations-to-experiences, fromStep: design-integrations, event: completed, toStep: design-experiences }
      - { id: integrations-error, fromStep: design-integrations, event: error, toStep: error }
      - { id: experiences-to-consolidate, fromStep: design-experiences, event: completed, toStep: consolidate }
      - { id: experiences-error, fromStep: design-experiences, event: error, toStep: error }
      - { id: consolidate-to-ready, fromStep: consolidate, event: completed, toStep: ready }
      - { id: consolidate-error, fromStep: consolidate, event: error, toStep: error }
      - { id: blocked-to-clarification, fromStep: ready, event: "false", toStep: clarification }
      - { id: ready-to-create, fromStep: ready, event: "true", toStep: create-plan }
      - { id: create-to-submit, fromStep: create-plan, event: success, toStep: submit-plan }
      - { id: create-error, fromStep: create-plan, event: error, toStep: error }
      - { id: submit-to-materialize, fromStep: submit-plan, event: success, toStep: materialize-plan }
      - { id: submit-error, fromStep: submit-plan, event: error, toStep: error }
      - { id: materialize-to-completed, fromStep: materialize-plan, event: success, toStep: completed }
      - { id: materialize-error, fromStep: materialize-plan, event: error, toStep: error }
  publish: true
  activate: true
