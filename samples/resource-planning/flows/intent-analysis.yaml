apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-intent-analysis }
definition:
  displayName: Resource Planning - intent analysis
  description: Durable functional requirement analysis child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-intent-analyst } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Solution goal }
      - { type: agent, name: analyze, displayName: Analyze intent, agent: { resourceId: resource-planning-intent-analyst }, inputMapping: "${input}" }
      - { type: output, name: output, displayName: Intent analysis, outputMapping: "${steps.analyze.output}" }
    transitions:
      - { id: input-to-analyze, fromStep: input, event: completed, toStep: analyze }
      - { id: analyze-to-output, fromStep: analyze, event: completed, toStep: output }
  publish: true
  activate: true
