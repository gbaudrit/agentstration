apiVersion: agentstration.io/v1
kind: Flow
metadata: { name: resource-planning-intent-analysis }
definition:
  displayName: Resource Planning - intent analysis
  description: Durable functional requirement analysis child Flow.
  version: 1.0.0
  enabled: true
  spec: { flowKind: direct, target: { kind: agent, id: resource-planning-intent-analyst } }
  graph:
    entryStep: input
    steps:
      - { type: input, name: input, displayName: Solution goal }
      - { type: agent, name: analyze, displayName: Analyze intent, agent: { resourceId: resource-planning-intent-analyst }, inputMapping: "${input}" }
      - { type: output, name: completed, displayName: Intent analysis, outcome: success, outputMapping: "${steps.analyze.output}" }
      - { type: output, name: error, displayName: Intent analysis failed, outcome: error, code: RESOURCE_PLANNING_AGENT_FAILED, message: The intent analysis Agent failed., outputMapping: "${transition.output}" }
    transitions:
      - { id: input-to-analyze, fromStep: input, event: completed, toStep: analyze }
      - { id: analyze-completed, fromStep: analyze, event: success, toStep: completed }
      - { id: analyze-error, fromStep: analyze, event: error, toStep: error }
  publish: true
  activate: true
