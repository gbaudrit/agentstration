apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: notification-delivery
definition:
  displayName: In-product notification delivery
  description: Maps the stable notification contract to the internal atomic MCP Tool.
  version: 1.0.0
  enabled: true
  spec:
    flowKind: direct
    target:
      kind: agent
      id: unused-graph-target
  graph:
    entryStep: input
    inputSchema:
      type: object
      properties:
        title: { type: string, maxLength: 200, pattern: '\S', description: 'Short user-visible notification heading.' }
        message: { type: string, maxLength: 4000, pattern: '\S', description: 'User-visible notification body.' }
        actionUrl: { type: string, maxLength: 2048, pattern: '^/(?!/)[^\\]*$', description: 'Optional local absolute Agentstration path; external URLs and backslashes are not supported.' }
      additionalProperties: false
      required: [title, message]
    outputSchema:
      type: object
      properties:
        notificationId: { type: string }
        createdAt: { type: string }
      required: [notificationId, createdAt]
    steps:
      - type: input
        name: input
        displayName: Delivery request
      - type: tool
        name: create-notification
        displayName: Create in-product notification
        tool:
          resourceId: agentstration.work.notification.create
        argumentsMapping:
          title: "${input.title}"
          message: "${input.message}"
          actionUrl: "${input.actionUrl}"
      - type: output
        name: output
        displayName: Delivery receipt
        outputMapping: "${steps.create-notification.output}"
    transitions:
      - { id: input-to-tool, fromStep: input, event: completed, toStep: create-notification }
      - { id: tool-to-output, fromStep: create-notification, event: completed, toStep: output }
  publish: true
  activate: true
