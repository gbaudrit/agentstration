apiVersion: agentstration.io/v1
kind: ToolDefinition
metadata:
  name: notification.send
definition:
  displayName: Send notification
  description: Notifies the current Workspace user about a relevant event or result through the active delivery Flow. A stable delivery key prevents duplicate notifications on retries; actions can target only local Agentstration paths.
  enabled: true
  requiresApproval: false
  inputSchema:
    type: object
    properties:
      deliveryKey: { type: string, maxLength: 256, pattern: '\S', description: 'Stable idempotency key for one logical notification in this Workspace; reuse it on retries.' }
      title: { type: string, maxLength: 200, pattern: '\S', description: 'Short user-visible notification heading.' }
      message: { type: string, maxLength: 4000, pattern: '\S', description: 'User-visible notification body.' }
      actionUrl: { type: string, maxLength: 2048, pattern: '^/(?!/)[^\\]*$', description: 'Optional local absolute Agentstration path; external URLs and backslashes are not supported.' }
    additionalProperties: false
    required: [deliveryKey, title, message]
  outputSchema:
    type: object
    properties:
      notificationId: { type: string }
      deliveryKey: { type: string }
      createdAt: { type: string }
      recovered: { type: boolean }
    required: [notificationId, deliveryKey, createdAt, recovered]
  flow:
    name: notification-delivery
    useActiveVersion: true
  invocationTimeoutSeconds: 90
