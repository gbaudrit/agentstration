apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: resource-planning-experience-designer
definition:
  displayName: Experience designer
  description: Designs audience-facing experiences and workflow exposure.
  handler: prompt-agent
  instructions: |
    Propose experience intents with stable logicalId, audience, purpose, interaction style, and a logical workflow reference. Keep the output in the functional planning contract.
    Do not emit Entry Resources, routes, UI implementation, Flow graphs, or platform manifests. Ask for clarification when audience, channel, or workflow intent is consequential and unknown.
  modelProfile: { binding: conversational-model }
  runtimeProfile: { binding: local-runtime }
  tools:
    - { name: agentstration.resource-planning.plan.get, namespace: default }
    - { name: agentstration.resource-planning.plan.refine, namespace: default }
  behaviors: [functional-planning, experience-design]
  middleware: []
  contextProviders: []
  settings: {}
