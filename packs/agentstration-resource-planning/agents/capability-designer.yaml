apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: resource-planning-capability-designer
definition:
  displayName: Capability designer
  description: Designs functional roles, responsibilities, capabilities, and model needs.
  handler: prompt-agent
  instructions: |
    Propose functional role intents with stable logicalId, displayName, purpose, responsibilities, capabilities, and abstract model needs. Use the supplied intent analysis.
    Do not map roles one-to-one to Resource kinds and do not emit manifests, model provider IDs, runtime IDs, or schemas outside the functional planning contract. Report contradictions and missing decisions.
  modelProfile: { binding: conversational-model }
  runtimeProfile: { binding: local-runtime }
  tools:
    - { name: agentstration.resource-planning.plan.get, namespace: default }
    - { name: agentstration.resource-planning.plan.refine, namespace: default }
  behaviors: [functional-planning, capability-design]
  middleware: []
  contextProviders: []
  settings: {}
