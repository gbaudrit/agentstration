apiVersion: agentstration.io/v1
kind: Pack
metadata:
  name: assistant
  publisher: agentstration
  version: 1.0.0
  audience: universal
  purpose: standard
  displayName: Agentstration Assistant
  description: Installs the official presentation-neutral Assistant router, help, diagnostics, and stable Entry.
  categories: [assistant, operations]
  tags: [help, diagnostics, resource-planning, local-first]
definition:
  targetScope: workspace
  bindings:
    - name: assistant-model
      targetKind: modelProfile
      displayName: Assistant model
      description: Model profile used by routing, help, diagnostics, and clarification Agents.
      required: true
    - name: assistant-runtime
      targetKind: runtimeProfile
      displayName: Assistant runtime
      description: Runtime profile used to execute the Assistant Agents locally.
      required: true
  resources:
    - agents/assistant-router.yaml
    - agents/assistant-help.yaml
    - agents/assistant-diagnostics.yaml
    - agents/assistant-fallback.yaml
    - flows/assistant-help.yaml
    - flows/assistant-diagnostics.yaml
    - flows/assistant-fallback.yaml
    - flows/assistant-router.yaml
    - entries/ask-agentstration.yaml
