apiVersion: agentstration.io/v1
kind: SourceVersion
metadata:
  name: official-samples
definition:
  version: "1"
  displayName: Agentstration official samples
  publisher:
    name: agentstration
  bindings:
    - name: distribution
      targetKind: sourceProvider
  channels:
    - name: stable
      compatibility:
        agentstration:
          minVersion: 0.2.0
          maxVersionExclusive: 0.3.0
      provider:
        binding: distribution
      configuration:
        optionSet: git/source-channel
        version: "1.0"
        schemaDigest: sha256:fixture
        values: {}
  catalogs: []
