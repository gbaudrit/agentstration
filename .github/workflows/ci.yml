name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.classify.outputs.dotnet }}
      aep: ${{ steps.classify.outputs.aep }}
      container: ${{ steps.classify.outputs.container }}
      storage: ${{ steps.classify.outputs.storage }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: pwsh
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $runEverything = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $baseRevision = if ('${{ github.event_name }}' -eq 'pull_request') {
            [string]$event.pull_request.base.sha
          }
          else {
            [string]$event.before
          }

          if (-not $runEverything -and
              -not [string]::IsNullOrWhiteSpace($baseRevision) -and
              $baseRevision -notmatch '^0+$') {
            $changedFiles = @(git diff --no-renames --name-only --diff-filter=ACDMRT $baseRevision HEAD)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not determine changed files from '$baseRevision'."
            }
          }
          else {
            $changedFiles = @()
            $runEverything = $true
          }

          ./scripts/ci/test-ci-contracts.ps1
          $classification = ./scripts/ci/classify-changes.ps1 -Paths $changedFiles -RunEverything:$runEverything
          $dotnet = $classification.dotnet
          $aep = $classification.aep
          $container = $classification.container
          $storage = $classification.storage

          "dotnet=$($dotnet.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "aep=$($aep.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "container=$($container.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "storage=$($storage.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Changed files: $($changedFiles.Count)"
          Write-Host "Run .NET validation: $dotnet"
          Write-Host "Run complete AEP validation: $aep"
          Write-Host "Build container: $container"
          Write-Host "Run storage smoke: $storage"

  windows-host-lifecycle:
    name: windows-host-lifecycle
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', 'aep/Directory.Build.props', 'aep/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore web tests
        run: dotnet restore tests/Agentstration.Web.Tests/Agentstration.Web.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build web tests
        run: dotnet build tests/Agentstration.Web.Tests/Agentstration.Web.Tests.csproj --configuration Release --no-restore
      - name: Verify Windows host lifecycle
        run: dotnet tests/Agentstration.Web.Tests/bin/Release/net10.0/Agentstration.Web.Tests.dll --filter "FullyQualifiedName~QuartzHostLifecycleTests|FullyQualifiedName~StartupDoesNotCreateLegacyDataJson" --minimum-expected-tests 2 --progress off

  build:
    name: build-linux
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    timeout-minutes: 15
    outputs:
      sdk-version: ${{ steps.sdk.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record the build SDK
        id: sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '.config/dotnet-tools.json', 'aep/Directory.Build.props', 'aep/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore Agentstration
        run: dotnet restore Agentstration.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Restore complete AEP SDK
        if: needs.changes.outputs.aep == 'true'
        run: dotnet restore aep/Aep.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Verify formatting of changed .NET files
        shell: pwsh
        run: ./scripts/ci/verify-dotnet-format.ps1 -BaseRevision "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Build Agentstration
        run: dotnet build Agentstration.slnx --configuration Release --no-restore
      - name: Build complete AEP SDK
        if: needs.changes.outputs.aep == 'true'
        run: dotnet build aep/Aep.slnx --configuration Release --no-restore
      - name: Smoke-test Source Registry tool package
        shell: pwsh
        run: ./scripts/ci/test-source-registry-tool-package.ps1 -Configuration Release -NoBuild
      - name: Validate build transfer
        shell: pwsh
        run: ./scripts/ci/test-build-transfer.ps1
      - name: Archive the Linux build
        shell: pwsh
        run: ./scripts/ci/transfer-linux-build.ps1 -Action Export -ArchiveDirectory "$env:RUNNER_TEMP/dotnet-build"
      - name: Upload the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-build-linux-${{ github.sha }}
          path: ${{ runner.temp }}/dotnet-build
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  functional-tests:
    name: functional-tests-${{ matrix.lane }}
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Fast
            minimum-tests: 777
            parallel-modules: 4
          - lane: Integration
            minimum-tests: 947
            parallel-modules: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore the shared Linux build
        uses: ./.github/actions/restore-linux-build
        with:
          sdk-version: ${{ needs.build.outputs.sdk-version }}
      - name: Test the functional lane
        run: dotnet test --solution Agentstration.Tests.${{ matrix.lane }}.slnx --configuration Release --no-build --minimum-expected-tests ${{ matrix.minimum-tests }} --max-parallel-test-modules ${{ matrix.parallel-modules }}

  aep-tests:
    name: aep-tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.aep == 'true'
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore the shared Linux build
        uses: ./.github/actions/restore-linux-build
        with:
          sdk-version: ${{ needs.build.outputs.sdk-version }}
          restore-aep: 'true'
      - name: Test complete AEP SDK
        working-directory: aep
        run: dotnet test --solution Aep.slnx --configuration Release --no-build --minimum-expected-tests 33 --max-parallel-test-modules 2

  # Keep the required check green for docs-only changes, but fail closed when
  # classification, compilation or any selected functional lane fails/skips.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs: [changes, build, functional-tests, aep-tests]
    if: always()
    steps:
      - name: Require the selected build and tests to pass
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          DOTNET_SELECTED: ${{ needs.changes.outputs.dotnet }}
          BUILD_RESULT: ${{ needs.build.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          AEP_SELECTED: ${{ needs.changes.outputs.aep }}
          AEP_RESULT: ${{ needs.aep-tests.result }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          if [ "$DOTNET_SELECTED" != true ]; then
            echo 'No product or build inputs changed; .NET validation is not required.'
            exit 0
          fi
          test "$BUILD_RESULT" = success
          test "$FUNCTIONAL_RESULT" = success
          if [ "$AEP_SELECTED" = true ]; then
            test "$AEP_RESULT" = success
          fi

  hosted-module-diagnostics:
    name: hosted-module-diagnostics-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [management-api, other]
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore the shared Linux build
        uses: ./.github/actions/restore-linux-build
        with:
          sdk-version: ${{ needs.build.outputs.sdk-version }}
      - name: Capture hosted module diagnostics
        env:
          AGENTSTRATION_TEST_HOST_METRICS: ${{ github.workspace }}/artifacts/test-diagnostics/hosts
        shell: pwsh
        run: |
          @(
            '## Hosted test module diagnostics',
            '',
            '| Module | Tests | Duration (s) | Peak working set (MiB) | Peak private memory (MiB) | Aggregate dotnet working set (MiB) | Status |',
            '| --- | ---: | ---: | ---: | ---: | ---: | --- |'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $modules = @(
            @{ Name = 'Agentstration.Api.Tests'; Tests = 23; Warning = 2048; Failure = 2432 },
            @{ Name = 'Agentstration.Api.Flows.Tests'; Tests = 74; Warning = 2048; Failure = 2432 },
            @{ Name = 'Agentstration.Api.Execution.Tests'; Tests = 58; Warning = 2048; Failure = 2432 },
            @{ Name = 'Agentstration.Api.Resources.Tests'; Tests = 80; Warning = 2048; Failure = 2432 },
            @{ Name = 'Agentstration.Management.Api.Tests'; Tests = 127; Warning = 1920; Failure = 2560 },
            @{ Name = 'Agentstration.Management.Bootstrap.Tests'; Tests = 31; Warning = 500; Failure = 700 },
            @{ Name = 'Agentstration.Management.Security.Tests'; Tests = 64; Warning = 1280; Failure = 1664 },
            @{ Name = 'Agentstration.Management.Aep.Tests'; Tests = 29; Warning = 832; Failure = 1024 }
          )
          $modules = @($modules | Where-Object { ($_.Name -eq 'Agentstration.Management.Api.Tests') -eq ('${{ matrix.group }}' -eq 'management-api') })
          foreach ($module in $modules) {
            ./scripts/ci/run-test-module-with-diagnostics.ps1 `
              -AssemblyPath "tests/$($module.Name)/bin/Release/net10.0/$($module.Name).dll" `
              -ReportPath "artifacts/test-diagnostics/$($module.Name).json" `
              -MinimumExpectedTests $module.Tests `
              -WarningWorkingSetMiB $module.Warning `
              -FailureWorkingSetMiB $module.Failure
          }
      - name: Upload hosted module diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-test-module-diagnostics-${{ matrix.group }}
          path: |
            artifacts/test-diagnostics/*.json
            artifacts/test-diagnostics/hosts/*.jsonl
          if-no-files-found: warn

  functional-coverage:
    name: functional-coverage-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore the shared Linux build
        uses: ./.github/actions/restore-linux-build
        with:
          sdk-version: ${{ needs.build.outputs.sdk-version }}
      - name: Collect functional coverage shard ${{ matrix.shard }}
        shell: pwsh
        run: ./scripts/ci/run-functional-coverage.ps1 -Configuration Release -NoBuild -Shard ${{ matrix.shard }} -SkipPublish
      - name: Upload raw functional coverage shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-code-coverage-raw-${{ matrix.shard }}
          path: artifacts/coverage/raw/${{ matrix.shard }}
          if-no-files-found: error

  publish-functional-coverage:
    name: publish-functional-coverage
    runs-on: ubuntu-latest
    needs: [changes, functional-coverage]
    if: needs.changes.outputs.dotnet == 'true' && needs.functional-coverage.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '.config/dotnet-tools.json', 'aep/Directory.Build.props', 'aep/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore repository tools
        run: dotnet tool restore
      - name: Download raw functional coverage shard a
        uses: actions/download-artifact@v8
        with:
          name: functional-code-coverage-raw-a
          path: artifacts/coverage/raw/a
      - name: Download raw functional coverage shard b
        uses: actions/download-artifact@v8
        with:
          name: functional-code-coverage-raw-b
          path: artifacts/coverage/raw/b
      - name: Publish consolidated functional coverage
        shell: pwsh
        run: ./scripts/ci/publish-functional-coverage.ps1
      - name: Upload functional coverage report
        uses: actions/upload-artifact@v7
        with:
          name: functional-code-coverage
          path: artifacts/coverage
          if-no-files-found: error

  postgresql-storage:
    name: postgresql-storage
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.storage == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentstration
          POSTGRES_USER: agentstration
          POSTGRES_PASSWORD: agentstration-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentstration -d agentstration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTSTRATION_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=agentstration;Username=agentstration;Password=agentstration-ci-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore the shared Linux build
        uses: ./.github/actions/restore-linux-build
        with:
          sdk-version: ${{ needs.build.outputs.sdk-version }}
      - name: Run PostgreSQL migration and restart test
        run: dotnet tests/Agentstration.Web.Tests/bin/Release/net10.0/Agentstration.Web.Tests.dll --filter "Name=EmptyDatabaseMigratesAndRemainsReadyAfterRestart" --minimum-expected-tests 1 --progress off
      - name: Run PostgreSQL storage concurrency benchmark
        env:
          AGENTSTRATION_STORAGE_BENCHMARK_PROVIDER: PostgreSql
          AGENTSTRATION_STORAGE_BENCHMARK_OPERATIONS: 40
          AGENTSTRATION_STORAGE_BENCHMARK_CONCURRENCY: 8
          AGENTSTRATION_STORAGE_BENCHMARK_REPORT: ${{ runner.temp }}/agentstration-storage-benchmark-postgresql.json
        run: |
          dotnet tests/Agentstration.Performance.Tests/bin/Release/net10.0/Agentstration.Performance.Tests.dll --filter "Name=ReportsConcurrentRelationalWriteMetrics" --minimum-expected-tests 1 --progress off
          cat "$AGENTSTRATION_STORAGE_BENCHMARK_REPORT"
      - name: Upload PostgreSQL storage smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-benchmark-postgresql-smoke
          path: ${{ runner.temp }}/agentstration-storage-benchmark-postgresql.json
          if-no-files-found: error

  container:
    name: container
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.container == 'true'
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agentstration:ci
          cache-from: type=gha,scope=ci-container
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-container' || '' }}
