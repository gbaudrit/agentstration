name: Release Source Registry tool

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-source-registry-tool.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'scripts/ci/test-source-registry-tool-package.ps1'
      - 'src/Agentstration.Management.Abstractions/**'
      - 'src/Agentstration.Management.Contracts/**'
      - 'src/Agentstration.Resources/**'
      - 'src/Agentstration.Tools.SourceRegistry/**'
      - 'tests/Agentstration.Tools.SourceRegistry.Tests/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-source-registry-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish Source Registry tool
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Resolve product and package versions
        id: version
        shell: pwsh
        run: |
          $project = 'src/Agentstration.Tools.SourceRegistry/Agentstration.Tools.SourceRegistry.csproj'
          $productVersion = (dotnet msbuild $project -nologo -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $productVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Source Registry tool product version '$productVersion' is not a supported Semantic Version."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$productVersion") {
              throw "Tag '$env:GITHUB_REF_NAME' does not match shared product version 'v$productVersion'."
            }
            $notes = "docs/releases/$productVersion.md"
            if (-not (Test-Path -LiteralPath $notes)) {
              throw "Shared release notes '$notes' are missing."
            }
            $packageVersion = $productVersion
            $channel = if ($productVersion.Contains('-')) { 'prerelease' } else { 'stable' }
          }
          else {
            $timestamp = [DateTimeOffset]::UtcNow.ToString('yyyyMMddHHmmss')
            $separator = if ($productVersion.Contains('-')) { '.' } else { '-' }
            $packageVersion = '{0}{1}dev.{2}.{3}.{4}' -f $productVersion, $separator, $timestamp, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
            $channel = 'development prerelease'
          }
          "product-version=$productVersion" >> $env:GITHUB_OUTPUT
          "package-version=$packageVersion" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
      - name: Require a commit from main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Restore tool tests
        run: >-
          dotnet restore tests/Agentstration.Tools.SourceRegistry.Tests/Agentstration.Tools.SourceRegistry.Tests.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
      - name: Build tool tests
        run: >-
          dotnet build tests/Agentstration.Tools.SourceRegistry.Tests/Agentstration.Tools.SourceRegistry.Tests.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
      - name: Test tool
        run: >-
          dotnet test tests/Agentstration.Tools.SourceRegistry.Tests/Agentstration.Tools.SourceRegistry.Tests.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.package-version }}
      - name: Smoke-test package
        shell: pwsh
        run: >-
          ./scripts/ci/test-source-registry-tool-package.ps1
          -Configuration Release
          -Version '${{ steps.version.outputs.package-version }}'
          -NoBuild
      - name: Pack release artifact
        run: >-
          dotnet pack src/Agentstration.Tools.SourceRegistry/Agentstration.Tools.SourceRegistry.csproj
          --configuration Release
          --no-restore
          --no-build
          --output artifacts
          -p:Version=${{ steps.version.outputs.package-version }}
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $package = @(Get-ChildItem artifacts/*.nupkg -File)
          if ($package.Count -ne 1) { throw "Expected exactly one Source Registry tool package." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($package[0].Name)" | Set-Content -Encoding utf8NoBOM artifacts/SHA256SUMS
      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: gbaudrit
      - name: Publish ${{ steps.version.outputs.channel }} package to NuGet.org
        run: >-
          dotnet nuget push artifacts/Agentstration.SourceRegistry.Tool.${{ steps.version.outputs.package-version }}.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
      - name: Upload validated package artifact
        uses: actions/upload-artifact@v6
        with:
          name: source-registry-tool-${{ steps.version.outputs.package-version }}
          path: |
            artifacts/*.nupkg
            artifacts/SHA256SUMS
          if-no-files-found: error
