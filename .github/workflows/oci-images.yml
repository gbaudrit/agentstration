name: OCI images

on:
  push:
    tags: ['extension/**', 'worker/**']
  workflow_dispatch:
    inputs:
      extension:
        description: Catalogue image ID (server, AEP extension or AWP Worker)
        type: choice
        options: [server, foundry, maf-worker]
        default: foundry
        required: true
      publish_preview:
        description: Publish the validated archive to private GHCR (no Docker Hub release)
        type: boolean
        default: false
      preview_pr:
        description: Automatic preview PR number (requires main, server, publish_preview and exact source_sha)
        type: string
        default: ''
      source_sha:
        description: Exact opted-in PR head for automatic server publication
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: extension-image-${{ inputs.preview_pr != '' && format('pr-{0}-{1}', inputs.preview_pr, inputs.source_sha) || github.ref }}-${{ inputs.extension || 'foundry' }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    outputs:
      build: ${{ steps.gate.outputs.build || steps.manual.outputs.build }}
      grant: ${{ steps.gate.outputs.grant }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve manual and official release packaging
        id: manual
        if: inputs.preview_pr == '' && inputs.source_sha == ''
        run: echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Check automatic server request boundary
        if: inputs.preview_pr != '' || inputs.source_sha != ''
        env:
          VALID: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.extension == 'server' && inputs.publish_preview && inputs.preview_pr != '' && inputs.source_sha != '' }}
        run: test "$VALID" = true
      - name: Install OCI metadata tooling
        if: inputs.preview_pr != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/login-action@v3
        if: inputs.preview_pr != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify live PR consent and reuse an already published exact image
        id: gate
        if: inputs.preview_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/preview/image_publication.py gate

  validate-and-build:
    needs: admission
    if: needs.admission.outputs.build == 'true'
    uses: ./.github/workflows/validate-oci-image.yml
    with:
      extension: ${{ inputs.extension || 'foundry' }}
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      source-sha: ${{ inputs.source_sha }}

  publish:
    needs: [admission, validate-and-build]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      issues: read
      pull-requests: read
    env:
      DOCKER_CONFIG: /tmp/extension-image-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oci-image-${{ needs.validate-and-build.outputs.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
      - name: Install OCI copy tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the validated archive to private GHCR without rebuilding
        if: inputs.preview_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_arguments=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then release_arguments=(--release-tag "$GITHUB_REF_NAME"); fi
          python3 scripts/packaging/images.py publish --delivery delivery/delivery.json --registry ghcr --authfile "$DOCKER_CONFIG/config.json" "${release_arguments[@]}"
      - name: Recheck live opt-in and publish the approved PR archive using main tooling
        if: inputs.preview_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPT_IN_GRANT: ${{ needs.admission.outputs.grant }}
        run: python3 scripts/preview/image_publication.py publish
      - name: Log in to Docker Hub for an official image release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the same archive to official Docker Hub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'agentstration' }}
        run: >-
          python3 scripts/packaging/images.py publish --delivery delivery/delivery.json
          --registry dockerhub --namespace "$DOCKERHUB_NAMESPACE"
          --release-tag "$GITHUB_REF_NAME" --authfile "$DOCKER_CONFIG/config.json"
      - name: Retain immutable publication references
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery/delivery.json
            delivery/publication-*.json
          if-no-files-found: warn
          retention-days: 30

  report-publication-failure:
    needs: [admission, validate-and-build, publish]
    if: always() && github.ref == 'refs/heads/main' && inputs.preview_pr != '' && (needs.admission.result == 'failure' || needs.validate-and-build.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report current image failure without changing deployed availability
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPT_IN_GRANT: ${{ needs.admission.outputs.grant }}
        run: python3 scripts/preview/image_publication.py report-failure
