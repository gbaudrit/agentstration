name: Initialize private extension packages (one-time)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghcr-empty-package-initialization
  cancel-in-progress: false
jobs:
  initialize-empty-packages:
    if: github.actor == 'gbaudrit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify owner scopes and initialize only empty private packages
        env:
          GHCR_BOOTSTRAP_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: python3 scripts/packaging/bootstrap_private_ghcr.py
      - name: Retain non-secret initialization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-empty-initialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ghcr-bootstrap.json
          if-no-files-found: warn
          retention-days: 30
