name: OCI images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify-private-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/lifecycle-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 668763bcaf2ea84c40d1ef804f6a25909001e860
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: extension-publication-45361771257-1
          run-id: 45361771257
          github-token: ${{ github.token }}
          path: receipts/server
      - uses: actions/download-artifact@v8
        with:
          name: extension-publication-45265550611-1
          run-id: 45265550611
          github-token: ${{ github.token }}
          path: receipts/worker
      - name: Verify private publication identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in agentstration-server agentstration-worker-maf; do
            test "$(gh api "/users/gbaudrit/packages/container/$package" --jq .visibility)" = private
            echo "$package: private"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "server": ("28e38606cb1a236886c4996d4d6791aa4fc24aaf", "sha256:e573710f4de9f25a33f51cfcda026f83844238e3f8d87d17cc7a78856e388e89", "server"),
              "worker": ("b9d6e97e076229ec6b258327dabfb29f0a17e21d", "sha256:2f85c63e1d55ebe6cdad21acc045e735aec2370b1f4cd2eec2f062ca9549663a", "worker-maf")
          }
          for name, (source, digest, image) in expected.items():
              folder = Path("receipts") / name
              delivery = json.loads((folder / "delivery.json").read_text())
              published = json.loads((folder / "publication-ghcr.json").read_text())
              assert delivery["sourceSha"] == published["sourceSha"] == source
              assert delivery["digest"] == published["digest"] == digest
              assert published["reference"] == f"ghcr.io/gbaudrit/agentstration-{image}@{digest}"
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify both database lifecycle implementations from private deliveries
        run: |
          set -euo pipefail
          for database in sqlite postgresql; do
            python3 scripts/preview/preview_smoke.py \
              --server-delivery receipts/server/delivery.json --worker-delivery receipts/worker/delivery.json \
              --database "$database" --registry ghcr.io --output "artifacts/lifecycle-$database-smoke.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*-smoke.json
          if-no-files-found: warn
          retention-days: 30
