name: OCI images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify-private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/preview-registry-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0e112843165e7db606004e8651033cec0c20d489
          persist-credentials: false
      - name: Download the published server receipt
        uses: actions/download-artifact@v8
        with:
          name: extension-publication-45348053442-1
          run-id: 45348053442
          github-token: ${{ github.token }}
          path: receipts/server
      - name: Download the independently published Worker receipt
        uses: actions/download-artifact@v8
        with:
          name: extension-publication-45265550611-1
          run-id: 45265550611
          github-token: ${{ github.token }}
          path: receipts/worker
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in agentstration-server agentstration-worker-maf; do
            visibility="$(gh api "/users/gbaudrit/packages/container/$package" --jq .visibility)"
            test "$visibility" = private
            echo "$package: private"
          done
      - name: Verify immutable publication receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "server": ("0e112843165e7db606004e8651033cec0c20d489", "sha256:53e8f3a946b2bda6375349d852d45075df2a7e11e3775e8c674fa77dddb97f75", "server"),
              "worker": ("b9d6e97e076229ec6b258327dabfb29f0a17e21d", "sha256:2f85c63e1d55ebe6cdad21acc045e735aec2370b1f4cd2eec2f062ca9549663a", "worker-maf")
          }
          for name, (source, digest, image) in expected.items():
              folder = Path("receipts") / name
              delivery = json.loads((folder / "delivery.json").read_text())
              publication = json.loads((folder / "publication-ghcr.json").read_text())
              assert delivery["sourceSha"] == publication["sourceSha"] == source
              assert delivery["digest"] == publication["digest"] == digest
              assert publication["reference"] == f"ghcr.io/gbaudrit/agentstration-{image}@{digest}"
              print(name, publication["reference"])
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the published digest-pinned SQLite preview
        run: >-
          python3 scripts/preview/preview_smoke.py
          --server-delivery receipts/server/delivery.json
          --worker-delivery receipts/worker/delivery.json
          --registry ghcr.io --output artifacts/preview-smoke.json
      - name: Retain the safe preview proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-sqlite-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview-smoke.json
          if-no-files-found: warn
          retention-days: 30
