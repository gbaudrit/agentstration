name: OCI images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify-private-database-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/preview-registry-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6b3ebd0a521ad6dac64535cc62b7346fda679d51
          persist-credentials: false
      - name: Download the published server receipt
        uses: actions/download-artifact@v8
        with:
          name: extension-publication-45361771257-1
          run-id: 45361771257
          github-token: ${{ github.token }}
          path: receipts/server
      - name: Download the independently published Worker receipt
        uses: actions/download-artifact@v8
        with:
          name: extension-publication-45265550611-1
          run-id: 45265550611
          github-token: ${{ github.token }}
          path: receipts/worker
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in agentstration-server agentstration-worker-maf; do
            visibility="$(gh api "/users/gbaudrit/packages/container/$package" --jq .visibility)"
            test "$visibility" = private
            echo "$package: private"
          done
      - name: Verify immutable publication receipts
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          expected = {
              "server": ("28e38606cb1a236886c4996d4d6791aa4fc24aaf", "server"),
              "worker": ("b9d6e97e076229ec6b258327dabfb29f0a17e21d", "worker-maf")
          }
          for name, (source, image) in expected.items():
              folder = Path("receipts") / name
              delivery = json.loads((folder / "delivery.json").read_text())
              publication = json.loads((folder / "publication-ghcr.json").read_text())
              assert delivery["sourceSha"] == publication["sourceSha"] == source
              digest = delivery["digest"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
              assert digest == publication["digest"]
              assert publication["reference"] == f"ghcr.io/gbaudrit/agentstration-{image}@{digest}"
              if name == "worker":
                  assert digest == "sha256:2f85c63e1d55ebe6cdad21acc045e735aec2370b1f4cd2eec2f062ca9549663a"
              print(name, publication["reference"])
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify both published digest-pinned database previews
        run: |
          set -euo pipefail
          for database in sqlite postgresql; do
            python3 scripts/preview/preview_smoke.py \
              --server-delivery receipts/server/delivery.json \
              --worker-delivery receipts/worker/delivery.json \
              --registry ghcr.io --database "$database" --output "artifacts/preview-$database-smoke.json"
          done
      - name: Retain safe preview proofs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-database-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*-smoke.json
          if-no-files-found: warn
          retention-days: 30
