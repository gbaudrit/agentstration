name: Verify reusable preview lifecycle outputs

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, deploy]
        default: validate
        required: true
      request:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  call:
    uses: gbaudrit/agentstration/.github/workflows/preview-environment.yml@2a4e0fdf9d55b55226c2797b445c9bfe8d8291bb
    with:
      operation: ${{ inputs.operation }}
      request: ${{ inputs.request }}
  assert-outputs:
    needs: call
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert success or deliberate off-main rejection outputs
        env:
          OPERATION: ${{ inputs.operation }}
          CALL_RESULT: ${{ needs.call.result }}
          RESULT_JSON: ${{ needs.call.outputs.result }}
          RESULT_STATE: ${{ needs.call.outputs.state }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ['OPERATION'] == 'validate':
              assert os.environ['CALL_RESULT'] == 'success'
              assert os.environ['RESULT_STATE'] == 'validated'
              assert json.loads(os.environ['RESULT_JSON'])['state'] == 'validated'
              print('PASS reusable validation returns its validated result.')
          else:
              assert os.environ['CALL_RESULT'] == 'failure'
              assert os.environ['RESULT_STATE'] == 'failed'
              assert not os.environ['RESULT_JSON']
              print('PASS failed host call is failed, without a substituted validation result.')
          PY
