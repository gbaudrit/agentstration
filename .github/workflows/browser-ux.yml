name: Browser UX

on:
  pull_request:
    paths:
      - automation/playwright/**
      - deploy/bootstrap/profiles/**
      - src/Agentstration.Console.*/**
      - src/Agentstration.Web/**
      - src/Agentstration.Web.Components/**
      - src/Agentstration.Web.FlowDesigner/**
      - src/Agentstration.Workplace.*/**
      - src/Agentstration.Runtime.Worker.MicrosoftAgentFramework/**
      - src/Agentstration.Extensions.Utilities/**
      - global.json
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - .github/workflows/browser-ux.yml
  push:
    branches: [main]
    paths:
      - automation/playwright/**
      - deploy/bootstrap/profiles/**
      - src/Agentstration.Console.*/**
      - src/Agentstration.Web/**
      - src/Agentstration.Web.Components/**
      - src/Agentstration.Web.FlowDesigner/**
      - src/Agentstration.Workplace.*/**
      - src/Agentstration.Runtime.Worker.MicrosoftAgentFramework/**
      - src/Agentstration.Extensions.Utilities/**
      - global.json
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - .github/workflows/browser-ux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-ux-tests:
    name: browser-ux (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            shard: 1
            shards: 3
          - project: desktop-chromium
            shard: 2
            shards: 3
          - project: desktop-chromium
            shard: 3
            shards: 3
          - project: mobile-chromium
            shard: 1
            shards: 2
          - project: mobile-chromium
            shard: 2
            shards: 2
          - project: locale-contracts
            shard: 1
            shards: 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '.config/dotnet-tools.json', 'aep/Directory.Build.props', 'aep/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/playwright/package-lock.json
      - name: Restore browser hosts
        run: |
          dotnet restore automation/playwright/fixtures/AcquisitionFailureHost/AcquisitionFailureHost.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore automation/playwright/fixtures/GovernedInventoryHost/GovernedInventoryHost.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore automation/playwright/fixtures/OrganizationStructureHost/OrganizationStructureHost.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Web/Agentstration.Web.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Workplace.Web/Agentstration.Workplace.Web.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Extensions.Ollama/Agentstration.Extensions.Ollama.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Extensions.Git/Agentstration.Extensions.Git.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Extensions.Foundry/Agentstration.Extensions.Foundry.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Extensions.Utilities/Agentstration.Extensions.Utilities.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore src/Agentstration.Runtime.Worker.MicrosoftAgentFramework/Agentstration.Runtime.Worker.MicrosoftAgentFramework.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build browser hosts
        run: |
          dotnet build automation/playwright/fixtures/AcquisitionFailureHost/AcquisitionFailureHost.csproj --configuration Release --no-restore
          dotnet build automation/playwright/fixtures/GovernedInventoryHost/GovernedInventoryHost.csproj --configuration Release --no-restore
          dotnet build automation/playwright/fixtures/OrganizationStructureHost/OrganizationStructureHost.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Web/Agentstration.Web.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Workplace.Web/Agentstration.Workplace.Web.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Extensions.Ollama/Agentstration.Extensions.Ollama.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Extensions.Git/Agentstration.Extensions.Git.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Extensions.Foundry/Agentstration.Extensions.Foundry.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Extensions.Utilities/Agentstration.Extensions.Utilities.csproj --configuration Release --no-restore
          dotnet build src/Agentstration.Runtime.Worker.MicrosoftAgentFramework/Agentstration.Runtime.Worker.MicrosoftAgentFramework.csproj --configuration Release --no-restore
      - name: Install browser automation dependencies
        working-directory: automation/playwright
        run: npm ci
      - name: Audit browser automation dependencies
        working-directory: automation/playwright
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: automation/playwright
        run: npx playwright install --with-deps chromium
      - name: Test browser host port reservations
        working-directory: automation/playwright
        run: npm run test:fixtures && npm run test:components
      - name: Run browser UX smoke tests
        working-directory: automation/playwright
        env:
          AGENTSTRATION_PLAYWRIGHT_NO_BUILD: true
        run: npm run test:smoke -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Write application coverage report
        if: always()
        working-directory: automation/playwright
        run: npm run coverage:report > test-results/application-coverage.md
      - name: Upload browser quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ux-evidence-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            automation/playwright/test-results
            automation/playwright/playwright-report
            automation/playwright/.work/*/*.log
          if-no-files-found: ignore
          include-hidden-files: true

  # Preserve the single required check while each shard has isolated hosts/data.
  browser-ux:
    name: browser-ux
    if: always()
    needs: browser-ux-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        env:
          BROWSER_PROJECTS_RESULT: ${{ needs.browser-ux-tests.result }}
        run: test "$BROWSER_PROJECTS_RESULT" = success
