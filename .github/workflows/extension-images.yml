name: Initialize private MAF Worker registry package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: initialize-private-maf-worker-package
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: /tmp/ghcr-init-auth-${{ github.run_id }}
    steps:
      - name: Require the owner credential for this one-time empty-image test
        env:
          OWNER_PACKAGE_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: test -n "$OWNER_PACKAGE_TOKEN"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
      - name: Initialize with an empty image and verify privacy before application upload
        env:
          GH_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess, tempfile, urllib.request, urllib.error
          repository = 'gbaudrit/agentstration'
          package = 'agentstration-worker-maf'
          endpoint = 'users/gbaudrit/packages/container/' + package
          def api(path, method='GET'):
              request = urllib.request.Request('https://api.github.com/' + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else None
          assert api('user')['login'].lower() == 'gbaudrit', 'Bootstrap credential must belong to the registry owner.'
          try:
              existing = api(endpoint)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              assert existing['visibility'] == 'private', 'Existing package is not private; refusing initialization.'
              print('Existing package is private; no bootstrap upload required.', flush=True)
              raise SystemExit(0)
          tag = 'registry-init-' + os.environ['GITHUB_RUN_ID']
          reference = 'ghcr.io/gbaudrit/' + package + ':' + tag
          with tempfile.TemporaryDirectory(prefix='empty-ghcr-init-') as temporary:
              path = pathlib.Path(temporary)
              (path / 'Dockerfile').write_text(
                  'FROM scratch\n'
                  'LABEL org.opencontainers.image.title="Empty registry initialization; no application files"\n')
              subprocess.run(['docker', 'build', '--provenance=false', '--sbom=false', '--tag', reference, str(path)], check=True)
              subprocess.run(['docker', 'push', reference], check=True)
          metadata = api(endpoint)
          print('Bootstrap package visibility:', metadata['visibility'], flush=True)
          allowed_tags = {tag}
          if metadata['visibility'] == 'private':
              linked_tag = 'registry-link-' + os.environ['GITHUB_RUN_ID']
              allowed_tags.add(linked_tag)
              linked = 'ghcr.io/gbaudrit/' + package + ':' + linked_tag
              with tempfile.TemporaryDirectory(prefix='empty-ghcr-link-') as temporary:
                  path = pathlib.Path(temporary)
                  (path / 'Dockerfile').write_text(
                      'FROM scratch\n'
                      'LABEL org.opencontainers.image.source="https://github.com/gbaudrit/agentstration"\n'
                      'LABEL org.opencontainers.image.title="Empty registry repository-link verification; no application files"\n')
                  subprocess.run(['docker', 'build', '--provenance=false', '--sbom=false', '--tag', linked, str(path)], check=True)
                  subprocess.run(['docker', 'push', linked], check=True)
              metadata = api(endpoint)
              print('Visibility after repository link:', metadata['visibility'], flush=True)
              if metadata['visibility'] == 'private':
                  print('Private package initialized and repository link verified with empty images only.', flush=True)
                  raise SystemExit(0)
          assert metadata['visibility'] == 'public', 'Unexpected package visibility.'
          run = api('repos/' + repository + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          created = datetime.datetime.fromisoformat(metadata['created_at'].replace('Z', '+00:00'))
          started = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
          assert created >= started, 'Package predates this empty initialization.'
          versions = api(endpoint + '/versions?per_page=100')
          tags = [value for version in versions for value in version.get('metadata', {}).get('container', {}).get('tags', [])]
          assert tags and set(tags) <= allowed_tags, 'Package has content outside this empty initialization.'
          api(endpoint, 'DELETE')
          try:
              api(endpoint)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise RuntimeError('Empty public package was not removed.')
          raise SystemExit('Registry created a public empty package; it was removed. No application image was uploaded.')
          PY
      - name: Describe the remaining repository access step
        run: |
          echo 'Package initialized with empty images only. In package settings, grant gbaudrit/agentstration Write under Manage Actions access before application publication.' >> "$GITHUB_STEP_SUMMARY"
