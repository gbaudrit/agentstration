name: Verify first private Foundry delivery

on:
  workflow_dispatch:
    inputs:
      publication_run:
        description: Successful main publication run ID
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: /tmp/ghcr-verification-auth-${{ github.run_id }}
    steps:
      - name: Verify main publication provenance and private visibility
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          run_id = os.environ['PUBLICATION_RUN']
          assert re.fullmatch(r'[0-9]+', run_id), 'Invalid publication run ID.'
          def api(path):
              request = urllib.request.Request('https://api.github.com/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = api('repos/gbaudrit/agentstration/actions/runs/' + run_id)
          assert run['head_branch'] == 'main' and run['event'] == 'workflow_dispatch'
          assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/extension-images.yml'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          package = api('users/gbaudrit/packages/container/agentstration-extension-foundry')
          assert package['visibility'] == 'private', 'GHCR package is not private.'
          print('Private visibility confirmed using the read-only repository Actions token.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source=' + run['head_sha'] + '\n')
              output.write('artifact=extension-publication-' + run_id + '-' + str(run['run_attempt']) + '\n')
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.provenance.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.provenance.outputs.artifact }}
          run-id: ${{ inputs.publication_run }}
          github-token: ${{ github.token }}
          path: delivery
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the exact GHCR digest and smoke startup and restart
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, urllib.error, urllib.request
          directory = pathlib.Path('delivery')
          delivery = json.loads((directory / 'delivery.json').read_text())
          publication = json.loads((directory / 'publication-ghcr.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert delivery['sourceSha'] == publication['sourceSha'] == source
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', delivery['digest'])
          reference = 'ghcr.io/gbaudrit/agentstration-extension-foundry@' + delivery['digest']
          assert publication['reference'] == reference
          assert publication['digest'] == delivery['digest']
          anonymous_denied = False
          try:
              with urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:gbaudrit/agentstration-extension-foundry:pull', timeout=15) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request('https://ghcr.io/v2/gbaudrit/agentstration-extension-foundry/manifests/' + delivery['digest'],
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'})
              with urllib.request.urlopen(request, timeout=15):
                  pass
          except urllib.error.HTTPError as error:
              if error.code not in (401, 403, 404):
                  raise
              anonymous_denied = True
          assert anonymous_denied, 'Anonymous registry access unexpectedly succeeded.'
          subprocess.run(['python3', 'scripts/packaging/smoke.py', '--delivery', str(directory / 'delivery.json'), '--image', reference], check=True)
          inspected = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
          proof = {'reference': reference, 'sourceSha': source, 'version': delivery['extension']['version'],
                   'visibility': 'private', 'anonymousPullDenied': True, 'authenticatedPullByDigest': True,
                   'healthAndAuthenticatedDiscoveryAndRestart': True, 'imageSizeBytes': inspected['Size']}
          (directory / 'verification.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: first-private-foundry-verification
          path: delivery/*.json
          if-no-files-found: error
          retention-days: 30

  cleanup-empty-initialization:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the two empty initialization versions after successful verification
        env:
          GH_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint = 'user/packages/container/agentstration-extension-foundry'
          expected = {'registry-init-45217660738', 'registry-link-45217660738'}
          def api(path, method='GET'):
              request = urllib.request.Request('https://api.github.com/' + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else None
          assert api('user')['login'].lower() == 'gbaudrit', 'Owner credential does not belong to the package owner.'
          assert api(endpoint)['visibility'] == 'private'
          versions = api(endpoint + '/versions?per_page=100')
          removed = 0
          for version in versions:
              tags = set(version.get('metadata', {}).get('container', {}).get('tags', []))
              if tags and tags <= expected:
                  api(endpoint + '/versions/' + str(version['id']), 'DELETE')
                  removed += 1
          assert api(endpoint)['visibility'] == 'private'
          print('Removed empty initialization versions:', removed)
          PY
