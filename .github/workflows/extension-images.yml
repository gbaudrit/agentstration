name: Recover first Foundry publication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: recover-first-foundry-package
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover privacy of the newly created test package
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request, urllib.error
          repository = 'gbaudrit/agentstration'
          package = 'agentstration-extension-foundry'
          source = 'd322a0a83d3bad7952f3bdd89b3c8c767b5ec904'
          endpoint = 'users/gbaudrit/packages/container/' + package
          def api(path, method='GET', data=None):
              request = urllib.request.Request('https://api.github.com/' + path, method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else None
          metadata = api(endpoint)
          visibility = metadata['visibility']
          print('Package visibility:', visibility, flush=True)
          if visibility != 'private':
              assert visibility == 'public', 'Unexpected package visibility.'
              run = api('repos/' + repository + '/actions/runs/45205494328')
              created = datetime.datetime.fromisoformat(metadata['created_at'].replace('Z', '+00:00'))
              started = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              assert created >= started, 'Package predates the authorized first publication.'
              versions = api(endpoint + '/versions?per_page=100')
              tags = [tag for version in versions for tag in version.get('metadata', {}).get('container', {}).get('tags', [])]
              assert tags and set(tags) == {'sha-' + source}, 'Package has content outside this first publication.'
              try:
                  api(endpoint, 'PATCH', {'visibility': 'private'})
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 405, 422):
                      raise
                  print('Visibility update unavailable; removing only the newly created public test package.', flush=True)
                  api(endpoint, 'DELETE')
              try:
                  metadata = api(endpoint)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  metadata = None
          private = metadata is not None and metadata['visibility'] == 'private'
          assert metadata is None or private, 'Package remains non-private.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('private=' + str(private).lower() + '\n')
          print('Recovery result:', 'private' if private else 'public test package removed', flush=True)
          PY
