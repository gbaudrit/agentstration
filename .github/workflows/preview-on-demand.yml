name: Preview on demand

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (reset is explicit destroy only)
        type: choice
        options: [validate, deploy, status, destroy]
        default: validate
        required: true
      environment_id:
        description: Stable isolated environment ID; reuse for status/destroy
        type: string
        default: manual-preview
        required: true
      revision:
        description: Published server revision (branch, tag, SHA or pr:NUMBER); ignored for status/destroy
        type: string
        default: main
        required: true
      provider:
        description: Deployment provider
        type: choice
        options: [azure-vm]
        default: azure-vm
      database:
        description: Database profile; change requires explicit reset first
        type: choice
        options: [sqlite, postgresql]
        default: sqlite
      vm_size_profile:
        description: AZURE_PREVIEW_VM_SIZE slot in preview-deployment
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      ttl_hours:
        description: Recorded TTL, 1-168 hours (automatic cleanup is follow-up 1286)
        type: number
        default: 2
      data_mode:
        description: Preserve data, or reset all owned resources on destroy
        type: choice
        options: [preserve, reset]
        default: preserve
      test_profile:
        description: Guest readiness profile; deployed Playwright is follow-up 1287
        type: choice
        options: [readiness, none]
        default: readiness
      worker_revision:
        description: Independent Worker revision, or published for its newest tagged image
        type: string
        default: published

permissions:
  contents: read

# Distinct from the reusable provider's concurrency group to avoid caller/callee deadlock.
concurrency:
  group: manual-preview-${{ inputs.environment_id }}
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the trusted deployment workflow branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow on main; select the application revision in the revision field.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate form choices before privileged jobs
        env:
          SELECTION_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/preview')
          import contract, manual
          manual.validate_options(contract.parse(os.environ['SELECTION_JSON']))
          PY

  select:
    needs: boundary
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'validate' || inputs.operation == 'deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-deployment
    permissions:
      contents: read
      packages: read
    outputs:
      request: ${{ steps.select.outputs.request }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install OCI metadata reader
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Freeze published images and protected environment defaults without Azure login
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_JSON: ${{ toJSON(inputs) }}
          AZURE_PREVIEW_SUBSCRIPTION_ID: ${{ vars.AZURE_PREVIEW_SUBSCRIPTION_ID }}
          AZURE_PREVIEW_RESOURCE_GROUP: ${{ vars.AZURE_PREVIEW_RESOURCE_GROUP }}
          AZURE_PREVIEW_REGION: ${{ vars.AZURE_PREVIEW_REGION }}
          AZURE_PREVIEW_IMAGE_VERSION: ${{ vars.AZURE_PREVIEW_IMAGE_VERSION }}
          AZURE_PREVIEW_OS_PROFILE: ${{ vars.AZURE_PREVIEW_OS_PROFILE }}
          AZURE_PREVIEW_VM_SIZE1: ${{ vars.AZURE_PREVIEW_VM_SIZE1 }}
          AZURE_PREVIEW_VM_SIZE2: ${{ vars.AZURE_PREVIEW_VM_SIZE2 }}
          AZURE_PREVIEW_VM_SIZE3: ${{ vars.AZURE_PREVIEW_VM_SIZE3 }}
          AZURE_PREVIEW_VM_SIZE4: ${{ vars.AZURE_PREVIEW_VM_SIZE4 }}
          AZURE_PREVIEW_VM_SIZE5: ${{ vars.AZURE_PREVIEW_VM_SIZE5 }}
        run: python3 scripts/preview/manual.py
      - uses: actions/upload-artifact@v7
        with:
          name: manual-preview-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manual-request.json
          retention-days: 30
          if-no-files-found: error

  recorded:
    needs: boundary
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'status' || inputs.operation == 'destroy')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-deployment
    permissions:
      contents: read
      id-token: write
    outputs:
      request: ${{ steps.recorded.outputs.request }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_PREVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PREVIEW_SUBSCRIPTION_ID }}
      - name: Read the recorded selection without resolving image tags or new defaults
        id: recorded
        env:
          SELECTION_JSON: ${{ toJSON(inputs) }}
          AZURE_PREVIEW_SUBSCRIPTION_ID: ${{ vars.AZURE_PREVIEW_SUBSCRIPTION_ID }}
          AZURE_PREVIEW_RESOURCE_GROUP: ${{ vars.AZURE_PREVIEW_RESOURCE_GROUP }}
          AZURE_PREVIEW_STORAGE_ACCOUNT: ${{ vars.AZURE_PREVIEW_STORAGE_ACCOUNT }}
          AZURE_PREVIEW_STORAGE_CONTAINER: ${{ vars.AZURE_PREVIEW_STORAGE_CONTAINER || 'previews' }}
        run: python3 scripts/preview/manual.py
      - uses: actions/upload-artifact@v7
        with:
          name: manual-preview-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manual-request.json
          retention-days: 30
          if-no-files-found: error

  execute:
    needs: [select, recorded]
    if: ${{ !cancelled() && (needs.select.result == 'success' || needs.recorded.result == 'success') }}
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/preview-environment.yml
    with:
      operation: ${{ inputs.operation }}
      request: ${{ needs.select.outputs.request || needs.recorded.outputs.request }}
