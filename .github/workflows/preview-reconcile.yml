name: Preview reconciliation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: [OCI images]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect actions without changing previews or GitHub comments
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: preview-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: preview-deployment
    permissions:
      contents: read
      issues: write
      pull-requests: write
      packages: read
      actions: read
      id-token: write
    env:
      DOCKER_CONFIG: /tmp/agentstration-preview-auth-${{ github.run_id }}-${{ github.run_attempt }}
      AZURE_PREVIEW_SUBSCRIPTION_ID: ${{ vars.AZURE_PREVIEW_SUBSCRIPTION_ID }}
      AZURE_PREVIEW_RESOURCE_GROUP: ${{ vars.AZURE_PREVIEW_RESOURCE_GROUP }}
      AZURE_PREVIEW_STORAGE_ACCOUNT: ${{ vars.AZURE_PREVIEW_STORAGE_ACCOUNT }}
      AZURE_PREVIEW_STORAGE_CONTAINER: ${{ vars.AZURE_PREVIEW_STORAGE_CONTAINER || 'previews' }}
      AZURE_PREVIEW_MAX_ENVIRONMENTS: ${{ vars.AZURE_PREVIEW_MAX_ENVIRONMENTS || '2' }}
      AZURE_PREVIEW_MAX_VCPUS: ${{ vars.AZURE_PREVIEW_MAX_VCPUS || '4' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_PREVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PREVIEW_SUBSCRIPTION_ID }}
      - name: Install pinned infrastructure compiler and OCI reader
        run: |
          az bicep install --version v0.44.1
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reconcile owned previews using live PR metadata and verified private image selections
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PREVIEW_EXTENSION_CONFIGURATION: ${{ secrets.PREVIEW_EXTENSION_CONFIGURATION }}
          AZURE_PREVIEW_REGION: ${{ vars.AZURE_PREVIEW_REGION }}
          AZURE_PREVIEW_IMAGE_VERSION: ${{ vars.AZURE_PREVIEW_IMAGE_VERSION }}
          AZURE_PREVIEW_OS_PROFILE: ${{ vars.AZURE_PREVIEW_OS_PROFILE }}
          AZURE_PREVIEW_VM_SIZE1: ${{ vars.AZURE_PREVIEW_VM_SIZE1 }}
          AZURE_PREVIEW_VM_SIZE2: ${{ vars.AZURE_PREVIEW_VM_SIZE2 }}
          AZURE_PREVIEW_VM_SIZE3: ${{ vars.AZURE_PREVIEW_VM_SIZE3 }}
          AZURE_PREVIEW_VM_SIZE4: ${{ vars.AZURE_PREVIEW_VM_SIZE4 }}
          AZURE_PREVIEW_VM_SIZE5: ${{ vars.AZURE_PREVIEW_VM_SIZE5 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_TEAM_DOMAIN }}
          CLOUDFLARE_PREVIEW_DOMAIN: ${{ vars.CLOUDFLARE_PREVIEW_DOMAIN }}
          CLOUDFLARE_ACCESS_APP_ID: ${{ vars.CLOUDFLARE_ACCESS_APP_ID }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          arguments=(--output "$RUNNER_TEMP/preview-reconciliation.json")
          if [[ "$DRY_RUN" != true ]]; then arguments+=(--apply); fi
          python3 scripts/preview/reconcile.py "${arguments[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-reconciliation.json
          retention-days: 14
          if-no-files-found: warn
