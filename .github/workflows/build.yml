name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Agentstration.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build Agentstration.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Agentstration.slnx --configuration Release --no-build

  aep:
    name: AEP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Aep.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build Aep.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Aep.slnx --configuration Release --no-build

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: platform
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file Dockerfile --tag agentstration:ci .
