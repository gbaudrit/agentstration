version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    exclude-paths:
      - aep/**
    groups:
      nuget-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /aep
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      aep-nuget-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
