# Isolated packaging test fixture; not a preview deployment topology.
services:
  authority:
    image: ${SMOKE_AUTHORITY_IMAGE:?Supply the locally built test authority image}
    pull_policy: never
    user: "${SMOKE_UID:?Supply the host test user}:${SMOKE_GID:?Supply the host test group}"
    ports: ["127.0.0.1::8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost;127.0.0.1;authority
      AI__Provider: Deterministic
      Data__Directory: /data
      Logging__LogLevel__Default: Warning
      Agentstration__InstanceId: foundry-packaging-smoke
      Agentstration__Storage__Provider: Sqlite
      Agentstration__Bootstrap__Path: /bootstrap
      Agentstration__Bootstrap__InitialBootstrapEnabled: "true"
      Agentstration__Bootstrap__InitialProfiles__0: development
      Agentstration__Bootstrap__Secrets__AdminPassword: ${SMOKE_ADMIN_PASSWORD:?Supply a disposable test password}
      Agentstration__Aep__Enrollment__AutoEnrollmentLevel: /instance
      Agentstration__Aep__Transport__AllowedHttpHosts__0: foundry
      Agentstration__Aep__Transport__AllowedPrivateNetworkHosts__0: foundry
      Agentstration__Extensions__Agentstration.Extensions.Foundry__EnrollmentMode: SharedKeyFile
      Agentstration__Extensions__Agentstration.Extensions.Foundry__SharedKeyFile__Path: /run/secrets/aep-key
    volumes:
      - ${SMOKE_DIRECTORY:?Supply an isolated test directory}/authority:/data
      - ${SMOKE_DIRECTORY}/key:/run/secrets/aep-key:ro
      - ${SMOKE_BOOTSTRAP_DIRECTORY:?Supply the repository bootstrap catalog}:/bootstrap:ro

  foundry:
    image: ${SMOKE_FOUNDRY_IMAGE:?Supply the exact Foundry delivery digest}
    pull_policy: never
    user: "${SMOKE_UID:?Supply the host test user}:${SMOKE_GID:?Supply the host test group}"
    ports: ["127.0.0.1::8080"]
    environment:
      Logging__LogLevel__Default: Warning
      Aep__EnrollmentMode: SharedKeyFile
      Aep__SharedKeyFile__Path: /run/secrets/aep-key
      Aep__SharedKeyFile__AuthorityUrl: http://authority:8080
      Aep__SharedKeyFile__PublicEndpoint: http://foundry:8080
      Aep__SharedKeyFile__StateFile: /var/lib/aep/instance
      Aep__SharedKeyFile__AllowInsecureHttp: "true"
    volumes:
      - ${SMOKE_DIRECTORY}/key:/run/secrets/aep-key:ro
      - ${SMOKE_DIRECTORY}/foundry:/var/lib/aep
