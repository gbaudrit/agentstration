# Isolated AWP packaging fixture; not a preview deployment topology.
services:
  authority:
    image: ${SMOKE_AUTHORITY_IMAGE:?Supply the local authority fixture}
    entrypoint: ["dotnet", "Agentstration.Web.dll"]
    pull_policy: never
    user: "${SMOKE_UID:?}:${SMOKE_GID:?}"
    ports: ["127.0.0.1::8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost;127.0.0.1;authority
      AI__Provider: Deterministic
      Data__Directory: /data
      Logging__LogLevel__Default: Warning
      Agentstration__InstanceId: worker-packaging-smoke
      Agentstration__Storage__Provider: Sqlite
      Agentstration__Bootstrap__Path: /bootstrap
      Agentstration__Bootstrap__InitialBootstrapEnabled: "true"
      Agentstration__Bootstrap__InitialProfiles__0: development
      Agentstration__Bootstrap__Secrets__AdminPassword: ${SMOKE_ADMIN_PASSWORD:?}
      Agentstration__Bootstrap__InitialApplications__0__Profiles__0: bootstrap-workspace-example
      Agentstration__Bootstrap__InitialApplications__0__TargetLevel: /tenants/dev/workspaces/default
      Agentstration__AwpWorkerTrust__Enabled: "true"
      Agentstration__AwpWorkerTrust__InstanceId: worker-packaging-smoke
      Agentstration__AwpWorkerTrust__Credentials__0__WorkerId: ${SMOKE_WORKER_ID:?}
      Agentstration__AwpWorkerTrust__Credentials__0__CredentialId: ${SMOKE_CREDENTIAL_ID:?}
      Agentstration__AwpWorkerTrust__Credentials__0__SharedKeyFile: /run/secrets/awp-key
    volumes:
      - ${SMOKE_DIRECTORY:?}/authority:/data
      - ${SMOKE_DIRECTORY}/key:/run/secrets/awp-key:ro
      - ${SMOKE_BOOTSTRAP_DIRECTORY:?}:/bootstrap:ro

  worker:
    image: ${SMOKE_WORKER_IMAGE:?Supply the exact Worker delivery digest}
    pull_policy: never
    user: "${SMOKE_UID:?}:${SMOKE_GID:?}"
    ports: ["127.0.0.1::8080"]
    environment:
      Logging__LogLevel__Default: Warning
      Agentstration__RuntimeWorker__AuthorityUrl: http://authority:8080
      Agentstration__RuntimeWorker__WorkerId: ${SMOKE_WORKER_ID}
      Agentstration__RuntimeWorker__CredentialId: ${SMOKE_CREDENTIAL_ID}
      Agentstration__RuntimeWorker__InstanceId: worker-packaging-smoke
      Agentstration__RuntimeWorker__SharedKeyFile: /run/secrets/awp-key
      Agentstration__RuntimeWorker__AllowInsecureHttp: "true"
      Agentstration__RuntimeWorker__ClaimWaitSeconds: "1"
    volumes:
      - ${SMOKE_DIRECTORY}/key:/run/secrets/awp-key:ro
